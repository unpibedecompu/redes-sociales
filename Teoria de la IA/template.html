<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template — Teoría de la IA · Corchetes Técnicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: #111;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  gap: 28px;
}

header {
  width: min(540px, 90vw);
}
.pilar-label {
  font-size: 0.7rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #9b5de5;
  margin-bottom: 8px;
}
header h2 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #eee;
  margin-bottom: 5px;
}
header p {
  font-size: 0.78rem;
  color: #555;
}

/* ── Carousel ── */
.ig-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: min(540px, 90vw);
}

.ig-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.ig-frame {
  flex: 1;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 14px;
  position: relative;
}

.ig-track {
  display: flex;
  width: 600%;
  height: 100%;
  transition: transform 0.38s cubic-bezier(.4, 0, .2, 1);
}

.ig-item {
  flex: 0 0 16.6667%;
  height: 100%;
  overflow: hidden;
  position: relative;
}

/* Slides are rendered at 1080×1080 (Instagram native) and scaled to fill the frame via transform. */
.sl-scale {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
  /* transform: scale(X) applied by JS */
}

.sl {
  width: 1080px;
  height: 1080px;
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  font-family: 'Outfit', sans-serif;
}

/* ── Arrows ── */
.arrow {
  background: none;
  border: 1px solid #2a2a2a;
  color: #555;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  transition: border-color .2s, color .2s;
  user-select: none;
}
.arrow:hover:not(:disabled) { border-color: #9b5de5; color: #9b5de5; }
.arrow:disabled { opacity: 0.2; cursor: default; }

/* ── Dots ── */
.ig-dots {
  display: flex;
  gap: 7px;
  align-items: center;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #2e2e2e;
  cursor: pointer;
  transition: background .22s, transform .22s;
}
.dot.active {
  background: #9b5de5;
  transform: scale(1.25);
}
</style>
</head>
<body>

<header>
  <div class="pilar-label">Pilar 1 · Teoría de la IA</div>
  <h2>Teoría de la IA — Corchetes Técnicos</h2>
  <p>Template de referencia · Paleta Lavanda + Lila Suave · Outfit · 6 slides · 1080×1080 px</p>
</header>

<div class="ig-wrap">
  <div class="ig-row">
    <button class="arrow" id="prev" disabled>&#8592;</button>
    <div class="ig-frame" id="frame">
      <div class="ig-track" id="track"></div>
    </div>
    <button class="arrow" id="next">&#8594;</button>
  </div>
  <div class="ig-dots" id="dots"></div>
</div>

<script>
const C = { bg1:'#f0e8ff', bg2:'#e4d4ff', acc:'#9b5de5', txt:'#1a1a1a', wht:'#ffffff' };

const brkAcc = `
  <svg style="position:absolute;top:54px;left:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="16,1 1,1 1,16" fill="none" stroke="${C.acc}" stroke-width="1.5"/></svg>
  <svg style="position:absolute;top:54px;right:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="0,1 15,1 15,16" fill="none" stroke="${C.acc}" stroke-width="1.5"/></svg>
  <svg style="position:absolute;bottom:54px;left:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="1,0 1,15 16,15" fill="none" stroke="${C.acc}" stroke-width="1.5"/></svg>
  <svg style="position:absolute;bottom:54px;right:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="15,0 15,15 0,15" fill="none" stroke="${C.acc}" stroke-width="1.5"/></svg>`;

const brkWht = `
  <svg style="position:absolute;top:54px;left:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="16,1 1,1 1,16" fill="none" stroke="white" stroke-width="1.5"/></svg>
  <svg style="position:absolute;top:54px;right:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="0,1 15,1 15,16" fill="none" stroke="white" stroke-width="1.5"/></svg>
  <svg style="position:absolute;bottom:54px;left:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="1,0 1,15 16,15" fill="none" stroke="white" stroke-width="1.5"/></svg>
  <svg style="position:absolute;bottom:54px;right:54px;opacity:.5" width="80" height="80" viewBox="0 0 16 16"><polyline points="15,0 15,15 0,15" fill="none" stroke="white" stroke-width="1.5"/></svg>`;

const slides = [
  `<div class="sl" style="background:${C.bg1};padding:86px;position:relative;display:flex;flex-direction:column;justify-content:flex-end">
    ${brkAcc}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:32px">
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:${C.acc}">Pilar 1 · Teoría de la IA</div>
      <div style="font-size:5.4rem;font-weight:700;color:${C.txt};line-height:1.15">Nombre del Concepto</div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.5">Por qué este concepto es central para entender el peligro de la IA</div>
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc};opacity:.7">@unpibedecompu</div>
    </div>
  </div>`,

  `<div class="sl" style="background:${C.wht};padding:86px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:48px">
    ${brkAcc}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:48px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">definición</div>
      <div style="font-size:4.5rem;font-weight:700;color:${C.txt};line-height:1.2">El concepto explicado en una frase que cualquiera entiende</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">Explicación divulgativa del mecanismo central, sin términos técnicos. Cómo funciona en la práctica con un ejemplo concreto.</div>
    </div>
  </div>`,

  `<div class="sl" style="background:${C.bg1};padding:86px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:48px">
    ${brkAcc}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:48px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">por qué importa</div>
      <div style="font-size:4.5rem;font-weight:700;color:${C.txt};line-height:1.2">Frase directa que conecta este concepto con el riesgo real</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">Cómo este concepto hace a la IA más difícil de controlar o más peligrosa. El vínculo con AI Safety en lenguaje llano.</div>
    </div>
  </div>`,

  `<div class="sl" style="background:${C.bg2};padding:86px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:48px">
    ${brkAcc}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:48px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">en sus palabras</div>
      <div style="font-size:3.9rem;font-weight:600;color:${C.txt};line-height:1.6;font-style:italic">"Cita textual de un profesional relevante sobre este concepto o su implicancia para la seguridad."</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:2.7rem;letter-spacing:.1em;text-transform:uppercase;color:${C.acc}">Nombre · Institución</div>
    </div>
  </div>`,

  `<div class="sl" style="background:${C.bg1};padding:86px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:54px">
    ${brkAcc}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:54px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">para pensar</div>
      <div style="font-size:4.86rem;font-weight:700;color:${C.txt};line-height:1.2">¿Pregunta abierta que invita a reflexionar sobre el problema?</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.65;line-height:1.6">Contexto adicional o reformulación de la pregunta para generar engagement.</div>
    </div>
  </div>`,

  `<div class="sl" style="background:${C.acc};padding:86px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:43px">
    ${brkWht}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:43px;text-align:center">
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7)">próximo concepto</div>
      <div style="font-size:4.86rem;font-weight:700;color:${C.wht};line-height:1.2">¿Qué concepto sigue?</div>
      <div style="width:130px;height:8px;background:rgba(255,255,255,.5)"></div>
      <div style="font-size:3.1rem;color:${C.wht};opacity:.75;line-height:1.5;max-width:810px">Seguinos para entender cómo funciona la IA — y por qué eso importa</div>
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:${C.wht};margin-top:16px">@unpibedecompu</div>
    </div>
  </div>`
];

const frame   = document.getElementById('frame');
const track   = document.getElementById('track');
const dotsEl  = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let current = 0;
const total = slides.length;
const step  = 100 / total;

// Build slides
slides.forEach(html => {
  const item = document.createElement('div');
  item.className = 'ig-item';
  const scaler = document.createElement('div');
  scaler.className = 'sl-scale';
  scaler.innerHTML = html;
  item.appendChild(scaler);
  track.appendChild(item);
});

// Build dots
for (let i = 0; i < total; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}

function applyScale() {
  const fw = frame.offsetWidth;
  const scale = fw / 1080;
  document.querySelectorAll('.sl-scale').forEach(el => {
    el.style.transform = `scale(${scale})`;
  });
}

function goTo(index) {
  current = Math.max(0, Math.min(index, total - 1));
  track.style.transform = `translateX(-${current * step}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo(current - 1);
  if (e.key === 'ArrowRight') goTo(current + 1);
});

applyScale();
window.addEventListener('resize', applyScale);
goTo(0);
</script>
</body>
</html>
