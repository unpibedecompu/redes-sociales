<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorador de animaciones</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --fondo: #1F1F1D; --panel: #2A2A28; --borde: #3E3E3A; --texto: #FAF9F5; --suave: #A8A69E; --acento: #D97757;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fondo); color: var(--texto);
    font-family: Tahoma, Verdana, sans-serif; font-size: 15px;
    display: grid; grid-template-columns: minmax(260px, 340px) 1fr; height: 100vh;
  }
  /* ---- lista ---- */
  #lado { display: flex; flex-direction: column; border-right: 1px solid var(--borde); min-height: 0; }
  #lado header { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--borde); }
  #lado h1 { font-size: 16px; margin: 0; }
  #buscar {
    font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--borde);
    background: var(--panel); color: var(--texto); width: 100%;
  }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; }
  #lista { overflow-y: auto; padding: 4px 0 24px; flex: 1; }
  details { border-bottom: 1px solid #2E2E2B; }
  summary {
    cursor: pointer; padding: 8px 12px; color: var(--suave); font-size: 13px; list-style: none;
    display: flex; justify-content: space-between; gap: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸"; margin-right: 6px; }
  details[open] > summary::before { content: "▾"; }
  summary span.n { color: #6E6C66; }
  .item {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 12px 7px 28px; font: inherit; color: var(--texto); background: none; border: 0; cursor: pointer;
  }
  .item:hover { background: var(--panel); }
  .item[aria-current="true"] { background: #3A2A24; box-shadow: inset 3px 0 var(--acento); }
  .item .tipo { font-size: 11px; color: var(--suave); border: 1px solid var(--borde); border-radius: 4px; padding: 0 4px; }
  /* ---- visor ---- */
  #visor { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #barra {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--borde);
  }
  #titulo { font-weight: bold; flex: 1; min-width: 160px; overflow-wrap: anywhere; }
  button.b, a.b {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid #555;
    background: #3A3A37; color: var(--texto); cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  button.b[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); }
  button.b:disabled { opacity: 0.4; cursor: default; }
  #volver { display: none; }
  #escenario { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; position: relative; }
  /* reel 1080x1920 escalado */
  #telefono { position: relative; aspect-ratio: 1080 / 1920; height: 100%; max-width: 100%; overflow: hidden; background: #000; border-radius: 14px; }
  #telefono iframe, #telefono video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; border: 0; transform-origin: 0 0; }
  #telefono video { object-fit: contain; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.6; display: none; }
  #telefono.con-overlay #overlay { display: block; }
  /* páginas que no son reel: a todo el panel */
  #libre { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 8px; display: none; }
  #tiempo { display: flex; gap: 8px; align-items: center; padding: 8px 12px 12px; border-top: 1px solid var(--borde); }
  #tiempo input[type=range] { flex: 1; accent-color: var(--acento); }
  #reloj { font-family: "Courier New", monospace; font-size: 13px; color: var(--suave); min-width: 96px; text-align: right; }
  #vacio { color: var(--suave); text-align: center; padding: 24px; }
  #aviso { padding: 8px 12px; font-size: 14px; border-bottom: 1px solid var(--borde); background: var(--panel); display: flex; gap: 10px; align-items: center; }
  #aviso[hidden] { display: none; }
  #aviso progress { flex: 1; max-width: 320px; accent-color: var(--acento); }
  #aviso.error { color: #FF8A80; }

  /* celular: la lista y el visor se turnan */
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    body.viendo #lado { display: none; }
    body:not(.viendo) #visor { display: none; }
    #volver { display: inline-block; }
    #lado { border-right: 0; height: 100vh; }
  }
</style>
</head>
<body>

<aside id="lado">
  <header>
    <h1>Animaciones del repo</h1>
    <input id="buscar" type="search" placeholder="Buscar (ej. yoshua escena)" autocomplete="off">
    <div class="filtros" role="group" aria-label="Tipo">
      <button class="b" data-filtro="animacion" aria-pressed="true">Animaciones</button>
      <button class="b" data-filtro="video" aria-pressed="false">Videos</button>
    </div>
  </header>
  <nav id="lista" aria-label="Archivos"></nav>
</aside>

<main id="visor">
  <div id="barra">
    <button class="b" id="volver">← Lista</button>
    <span id="titulo">Elegí una animación de la lista</span>
    <button class="b" id="b-overlay" aria-pressed="false" title="Superponer la guía de Instagram Reels (pilares/recursos)">Overlay IG</button>
    <button class="b" id="b-recargar">Recargar</button>
    <a class="b" id="b-abrir" target="_blank" rel="noopener">Abrir sola ↗</a>
    <button class="b" id="b-mp4" title="Renderiza la animación a mp4 (1080×1920, 30 fps) y la descarga">⬇ MP4</button>
  </div>
  <div id="aviso" role="status" hidden></div>
  <div id="escenario">
    <div id="vacio">Las animaciones de reel (1080×1920) se ven en formato teléfono, con la guía de Instagram opcional y una barra de tiempo.</div>
    <div id="telefono" hidden>
      <iframe id="marco" title="Animación"></iframe>
      <video id="video" controls playsinline hidden></video>
      <img id="overlay" src="../pilares/recursos/IG-Reels-Overlay-1080x1920.png" alt="">
    </div>
    <iframe id="libre" title="Página"></iframe>
  </div>
  <div id="tiempo" hidden>
    <button class="b" id="b-play" aria-pressed="true">⏸</button>
    <input id="barra-t" type="range" min="0" max="1" step="0.001" value="0" aria-label="Tiempo">
    <span id="reloj">0.00 / 0.00 s</span>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let archivos = [], filtro = "animacion", actual = null;
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

  // ---- lista agrupada por carpeta ----
  async function cargar() {
    archivos = await (await fetch("lista.json")).json();
    pintarLista();
    const ruta = decodeURIComponent(location.hash.slice(1));
    if (ruta && archivos.some(a => a.ruta === ruta)) abrir(ruta, false);
  }
  function pintarLista() {
    const q = $("buscar").value.toLowerCase().split(/\s+/).filter(Boolean);
    const grupos = new Map();
    for (const a of archivos) {
      if (a.tipo !== filtro) continue;
      if (!q.every(p => a.ruta.toLowerCase().includes(p))) continue;
      const i = a.ruta.lastIndexOf("/");
      const carpeta = i < 0 ? "(raíz)" : a.ruta.slice(0, i);
      if (!grupos.has(carpeta)) grupos.set(carpeta, []);
      grupos.get(carpeta).push(a);
    }
    const abiertas = JSON.parse(leer("explorador-abiertas") || "[]");
    $("lista").innerHTML = "";
    if (!grupos.size) { $("lista").innerHTML = `<p id="vacio">Nada coincide.</p>`; return; }
    for (const [carpeta, items] of grupos) {
      const d = document.createElement("details");
      d.open = q.length > 0 || abiertas.includes(carpeta) || (actual && actual.startsWith(carpeta + "/"));
      d.innerHTML = `<summary><span>${carpeta.replace(/^pilares\//, "")}</span><span class="n">${items.length}</span></summary>`;
      d.addEventListener("toggle", () => {
        const s = new Set(JSON.parse(leer("explorador-abiertas") || "[]"));
        d.open ? s.add(carpeta) : s.delete(carpeta);
        guardar("explorador-abiertas", JSON.stringify([...s]));
      });
      for (const a of items) {
        const b = document.createElement("button");
        b.className = "item";
        b.dataset.ruta = a.ruta;
        b.setAttribute("aria-current", a.ruta === actual);
        b.innerHTML = `<span>${a.ruta.slice(a.ruta.lastIndexOf("/") + 1).replace(/\.(html|mp4)$/, "").replace(/_/g, " ")}</span>`;
        b.addEventListener("click", () => abrir(a.ruta));
        d.appendChild(b);
      }
      $("lista").appendChild(d);
    }
  }
  $("buscar").addEventListener("input", pintarLista);
  document.querySelectorAll("[data-filtro]").forEach(b => b.addEventListener("click", () => {
    filtro = b.dataset.filtro;
    document.querySelectorAll("[data-filtro]").forEach(x => x.setAttribute("aria-pressed", x === b));
    pintarLista();
  }));

  // ---- visor ----
  const url = ruta => "../" + ruta.split("/").map(encodeURIComponent).join("/");
  function abrir(ruta, historial = true) {
    actual = ruta;
    if (historial) history.replaceState(null, "", "#" + encodeURIComponent(ruta));
    document.body.classList.add("viendo");
    document.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", b.dataset.ruta === ruta));
    $("titulo").textContent = ruta.replace(/^pilares\//, "");
    $("b-abrir").href = url(ruta);
    $("vacio").hidden = true;
    $("tiempo").hidden = true;
    if (!renderEnCurso) aviso("");
    escena = null;
    if (ruta.endsWith(".mp4")) {
      $("libre").style.display = "none";
      $("telefono").hidden = false;
      $("marco").hidden = true; $("marco").src = "about:blank";
      $("video").hidden = false; $("video").src = url(ruta);
      ajustar();
      return;
    }
    $("video").hidden = true; $("video").removeAttribute("src");
    // primero en el teléfono; si al cargar no es un reel de 1080x1920, pasa a la vista libre
    $("telefono").hidden = false; $("marco").hidden = false; $("libre").style.display = "none";
    $("marco").src = url(ruta);
    ajustar();
  }

  // escala del iframe/video de 1080x1920 al tamaño del teléfono
  function ajustar() {
    const w = $("telefono").clientWidth;
    for (const n of [$("marco"), $("video")]) n.style.transform = `scale(${w / 1080})`;
  }
  new ResizeObserver(ajustar).observe($("telefono"));

  // ---- integración con las escenas: render(t), DURATION y mode del reel ----
  let escena = null;     // { win, dur }
  $("marco").addEventListener("load", () => {
    const win = $("marco").contentWindow;
    if (!actual || $("marco").src === "about:blank") return;
    let doc;
    try { doc = win.document; } catch (e) { return; }
    const svg = doc.querySelector("svg[viewBox='0 0 1080 1920']");
    if (!svg) {
      // no es un reel: a todo el panel
      $("telefono").hidden = true;
      $("libre").style.display = "block";
      $("libre").src = url(actual);
      $("marco").src = "about:blank";
      return;
    }
    // solo el cuadro, sin márgenes ni botones propios
    const st = doc.createElement("style");
    st.textContent = `body{padding:0!important;margin:0!important;background:#000!important;overflow:hidden}
      body > :not(svg):not(script){display:none!important}
      svg[viewBox='0 0 1080 1920']{width:1080px!important;height:1920px!important;max-width:none!important;max-height:none!important}`;
    doc.head.appendChild(st);
    let dur = null;
    try { dur = win.eval("typeof DURATION !== 'undefined' ? DURATION : (typeof DURACION !== 'undefined' ? DURACION : null)"); } catch (e) {}
    const tieneRender = typeof win.render === "function";
    if (dur && tieneRender) {
      escena = { win, dur };
      $("tiempo").hidden = false;
      $("barra-t").max = dur;
      reproducir(true);
    }
  });

  // reproducción propia: las escenas tienen mode = "anim" | otro; con otro, no se dibujan solas
  let tocando = true, t0 = 0, tPausa = 0;
  function reproducir(si) {
    tocando = si;
    $("b-play").textContent = si ? "⏸" : "▶";
    $("b-play").setAttribute("aria-pressed", si);
    if (!escena) return;
    try { escena.win.eval('mode = "explorador"'); } catch (e) {}
    t0 = performance.now() - tPausa * 1000;
  }
  function cuadro(now) {
    if (escena) {
      let t;
      if (tocando) { t = ((now - t0) / 1000) % escena.dur; tPausa = t; }
      else t = Number($("barra-t").value);
      try { escena.win.render(Math.min(t, escena.dur - 0.001)); } catch (e) {}
      if (tocando) $("barra-t").value = t;
      $("reloj").textContent = `${t.toFixed(2)} / ${escena.dur.toFixed(2)} s`;
    }
    requestAnimationFrame(cuadro);
  }
  requestAnimationFrame(cuadro);
  $("b-play").addEventListener("click", () => { tPausa = Number($("barra-t").value); reproducir(!tocando); });
  $("barra-t").addEventListener("input", () => { if (tocando) reproducir(false); tPausa = Number($("barra-t").value); });

  // ---- botones ----
  $("b-overlay").addEventListener("click", () => {
    const on = $("b-overlay").getAttribute("aria-pressed") !== "true";
    $("b-overlay").setAttribute("aria-pressed", on);
    $("telefono").classList.toggle("con-overlay", on);
    guardar("explorador-overlay", on ? "1" : "0");
  });
  if (leer("explorador-overlay") === "1") $("b-overlay").click();
  $("b-recargar").addEventListener("click", () => actual && abrir(actual));

  // ---- descargar mp4: los videos se bajan directo; las animaciones las renderiza el servidor ----
  const nombreDe = ruta => ruta.slice(ruta.lastIndexOf("/") + 1);
  function bajar(href, nombre) {
    const a = document.createElement("a");
    a.href = href; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function aviso(html, error = false) {
    $("aviso").hidden = !html;
    $("aviso").classList.toggle("error", error);
    $("aviso").innerHTML = html || "";
  }
  let renderEnCurso = null;
  $("b-mp4").addEventListener("click", async () => {
    if (!actual) return;
    if (actual.endsWith(".mp4")) return bajar(url(actual), nombreDe(actual));
    if (renderEnCurso) return;
    const ruta = actual, q = "?ruta=" + encodeURIComponent(ruta);
    renderEnCurso = ruta;
    $("b-mp4").disabled = true;
    try {
      let e = await (await fetch("render/iniciar" + q)).json();
      while (e.estado === "en cola" || e.estado === "renderizando") {
        if (actual === ruta) aviso(`<span>Renderizando ${nombreDe(ruta)}…</span><progress value="${e.progreso}" max="1"></progress><span>${Math.round(e.progreso * 100)}% · ${e.mensaje}</span>`);
        await new Promise(r => setTimeout(r, 1000));
        e = await (await fetch("render/estado" + q)).json();
      }
      if (e.estado === "listo") {
        aviso(`<span>MP4 listo: ${nombreDe(ruta).replace(/\.html$/, ".mp4")}</span>`);
        bajar("render/descargar" + q, nombreDe(ruta).replace(/\.html$/, ".mp4"));
        setTimeout(() => { if (renderEnCurso === null) aviso(""); }, 6000);
      } else {
        aviso(`No se pudo renderizar: ${e.mensaje}`, true);
      }
    } catch (err) {
      aviso(`No se pudo renderizar: ${err.message}`, true);
    } finally {
      renderEnCurso = null;
      $("b-mp4").disabled = false;
    }
  });
  $("volver").addEventListener("click", () => document.body.classList.remove("viendo"));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " " && escena) { e.preventDefault(); $("b-play").click(); }
  });

  cargar();
</script>
</body>
</html>
