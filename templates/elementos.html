<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elementos Gráficos — Riesgo IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background: #111; color: #eee; padding: 40px 20px; }
h1 { text-align: center; font-size: 1.2rem; letter-spacing: 0.15em; text-transform: uppercase; color: #aaa; margin-bottom: 8px; }
p.sub { text-align: center; font-size: 0.8rem; color: #555; margin-bottom: 40px; }

.style-list { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.style-item { display: flex; flex-direction: column; }

.style-row {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 20px; border-radius: 8px; cursor: pointer;
  border: 1px solid #222; background: #1a1a1a;
  transition: border-color 0.2s, background 0.2s;
  user-select: none;
}
.style-row:hover { border-color: #444; background: #202020; }
.style-row.active { border-color: #9b5de5; background: #1a1428; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }

.style-num { font-size: 0.7rem; color: #444; width: 20px; flex-shrink: 0; text-align: right; }
.style-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.style-name { font-size: 0.95rem; color: #ddd; font-weight: 600; }
.style-desc { font-size: 0.72rem; color: #666; }
.style-tags { display: flex; gap: 6px; margin-top: 4px; }
.tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 20px; border: 1px solid #333; color: #777; }

.chevron { font-size: 0.7rem; color: #444; flex-shrink: 0; transition: transform 0.2s; }
.style-row.active .chevron { transform: rotate(180deg); color: #9b5de5; }

.style-preview {
  display: none;
  background: #161616;
  border: 1px solid #9b5de5;
  border-top: none;
  border-bottom-left-radius: 8px;
  border-bottom-right-radius: 8px;
  padding: 24px 20px;
}
.style-preview.open { display: block; }

.questions {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.question { background: #1e1e1e; border-radius: 6px; padding: 12px; }
.q-label { font-size: 0.6rem; color: #9b5de5; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.q-answer { font-size: 0.72rem; color: #ccc; line-height: 1.5; }

.slides-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.slide-wrap { display: flex; flex-direction: column; gap: 6px; }
.slide-cap { font-size: 0.6rem; color: #444; text-align: center; letter-spacing: 0.06em; text-transform: uppercase; }

/* Base slide */
.sl {
  width: 100%; aspect-ratio: 1/1;
  border-radius: 6px; overflow: hidden;
  position: relative;
  font-family: 'Outfit', sans-serif;
}
</style>
</head>

          <div class="q-answer">${s.q3}</div>
        </div>
      </div>
      <div class="slides-row">
        ${slideHtmls.map((html, si) => `
          <div class="slide-wrap">
            <div class="slide-cap">${slideLabels[si]}</div>
            ${html}
          </div>`).join('')}
      </div>`;

    row.addEventListener('click', () => {
      const isOpen = preview.classList.contains('open');
      document.querySelectorAll('.style-preview.open').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.style-row.active').forEach(el => el.classList.remove('active'));
      if (!isOpen) {
        preview.classList.add('open');
        row.classList.add('active');
      }
    });

    item.appendChild(row);
    item.appendChild(preview);
    list.appendChild(item);
  });
}

render();
</script>
</body>
</html>
