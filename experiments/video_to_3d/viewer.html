<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video to 3D Loop</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root { --bg:#f4f3f0; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0db; --accent:#5b3fa8; --good:#2f7d4f; --bad:#b0412e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --card:#1e1e22; --ink:#ececee; --muted:#9a9aa2; --line:#2e2e34; --accent:#a78bfa; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; padding:20px 16px 60px; }
  header { max-width:1400px; margin:0 auto 16px; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tabs a { padding:4px 12px; border:1px solid var(--line); border-radius:999px; color:var(--ink); text-decoration:none; font-variant-numeric:tabular-nums; }
  .tabs a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:1400px; margin:0 auto; display:grid; gap:16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px){ .row { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  video, model-viewer { width:100%; height:auto; aspect-ratio:16/9; background:#9a9a9a; border-radius:8px; display:block; }
  model-viewer { height:340px; }
  img.cmp { width:100%; border-radius:8px; display:block; }
  .stats { display:flex; gap:24px; flex-wrap:wrap; }
  .stat b { display:block; font-size:28px; font-variant-numeric:tabular-nums; }
  .stat span { color:var(--muted); font-size:13px; }
  .md { font-size:14px; overflow-wrap:anywhere; }
  .md pre { white-space:pre-wrap; background:var(--bg); padding:8px; border-radius:6px; }
  .history { display:flex; gap:8px; align-items:flex-end; height:90px; }
  .bar { flex:1; background:var(--accent); opacity:.35; border-radius:4px 4px 0 0; position:relative; min-height:4px; }
  .bar.on { opacity:1; }
  .bar i { position:absolute; top:-18px; left:0; right:0; text-align:center; font-style:normal; font-size:12px; color:var(--muted); }
  .muted { color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.step { cursor:pointer; } tr.step:hover, tr.step.on { background:var(--bg); }
  td.up { color:var(--good); } td.down { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Video → 3D · <span id="title">iteration</span></h1>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <div class="row">
    <div class="card"><h2>Target video</h2><video src="input/target_web.mp4" autoplay muted loop playsinline></video></div>
    <div class="card"><h2>Generated model (drag to orbit)</h2>
      <model-viewer id="mv" camera-controls auto-rotate rotation-per-second="36deg" auto-rotate-delay="0" environment-image="neutral" shadow-intensity="0" field-of-view="25deg" camera-orbit="0deg 85deg auto"></model-viewer>
    </div>
  </div>
  <div class="card">
    <h2>Scores</h2>
    <div class="stats" id="stats"></div>
    <h2 style="margin-top:16px">Silhouette IoU by iteration</h2>
    <div class="history" id="history"></div>
  </div>
  <div class="card"><h2>Target (top) vs render (bottom) at 8 turntable angles</h2><img class="cmp" id="cmp" alt="comparison sheet"></div>
  <div class="card" id="stepsCard" hidden>
    <h2>Designer small-step log</h2>
    <div style="overflow-x:auto"><table id="steps"></table></div>
    <img class="cmp" id="stepImg" alt="selected step comparison" style="margin-top:10px">
  </div>
  <div class="row">
    <div class="card"><h2>Designer notes</h2><div class="md" id="design"></div></div>
    <div class="card"><h2>Reviewer verdict</h2><div class="md" id="review"></div></div>
  </div>
</main>
<script>
  const N = 9;
  const cur = new URLSearchParams(location.search).get('iter') || '1';
  const base = `iterations/iter_${cur}/`;
  const bust = `?t=${Date.now()}`;
  document.getElementById('title').textContent = `iteration ${cur} of ${N}`;
  const get = (p, kind) => fetch(p + bust).then(r => r.ok ? (kind === 'json' ? r.json() : r.text()) : null).catch(() => null);
  const md = t => t ? marked.parse(t) : '<p class="muted">Not written yet.</p>';
  const score = t => { const m = t && t.match(/score[^0-9]{0,12}([0-9]+(?:\.[0-9])?)\s*\/\s*10/i); return m ? m[1] : '–'; };

  (async () => {
    document.getElementById('mv').src = base + 'model.glb' + bust;
    document.getElementById('cmp').src = base + 'comparison.png' + bust;
    const [metrics, design, review] = await Promise.all([get(base + 'metrics.json', 'json'), get(base + 'design.md'), get(base + 'review.md')]);
    document.getElementById('design').innerHTML = md(design);
    document.getElementById('review').innerHTML = md(review);
    document.getElementById('stats').innerHTML =
      `<div class="stat"><b>${metrics ? metrics.mean_silhouette_iou.toFixed(3) : '–'}</b><span>mean silhouette IoU</span></div>` +
      `<div class="stat"><b>${score(review)}<small style="font-size:14px">/10</small></b><span>reviewer score</span></div>`;

    const stepsTxt = await get(base + 'steps.jsonl');
    if (stepsTxt) {
      const rows = stepsTxt.trim().split(/\r?\n/).map(l => JSON.parse(l));
      const best = Math.max(...rows.map(r => r.mean_iou));
      const tbl = document.getElementById('steps');
      tbl.innerHTML = '<tr><th>#</th><th>change</th><th>IoU</th><th>Δ</th></tr>' + rows.map((r, i) => {
        const d = i ? r.mean_iou - rows[i - 1].mean_iou : 0;
        return `<tr class="step" data-k="${r.step}"><td>${r.step}${r.mean_iou === best ? ' ★' : ''}</td><td>${r.desc.replace(/</g, '&lt;')}</td>` +
               `<td>${r.mean_iou.toFixed(3)}</td><td class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${i ? (d >= 0 ? '+' : '') + d.toFixed(3) : ''}</td></tr>`;
      }).join('');
      const pick = k => { document.getElementById('stepImg').src = `${base}steps/step_${k}.png${bust}`;
        tbl.querySelectorAll('tr.step').forEach(tr => tr.classList.toggle('on', tr.dataset.k == k)); };
      tbl.addEventListener('click', e => { const tr = e.target.closest('tr.step'); if (tr) pick(tr.dataset.k); });
      pick(rows[rows.length - 1].step);
      document.getElementById('stepsCard').hidden = false;
    }
    const tabs = document.getElementById('tabs'), hist = document.getElementById('history');
    for (let i = 1; i <= N; i++) {
      const m = await get(`iterations/iter_${i}/metrics.json`, 'json');
      const a = document.createElement('a');
      a.href = `?iter=${i}`; a.textContent = `#${i}`; if (String(i) === cur) a.className = 'on';
      tabs.appendChild(a);
      const v = m ? m.mean_silhouette_iou : 0;
      hist.insertAdjacentHTML('beforeend', `<div class="bar${String(i) === cur ? ' on' : ''}" style="height:${Math.max(v * 100, 4)}%"><i>${m ? v.toFixed(2) : '#' + i}</i></div>`);
    }
  })();
</script>
</body>
</html>
