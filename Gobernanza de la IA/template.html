<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template — Gobernanza de la IA · Cruces Decorativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: #111;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  gap: 28px;
}

header {
  width: min(540px, 90vw);
}
.pilar-label {
  font-size: 0.7rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #9b5de5;
  margin-bottom: 8px;
}
header h2 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #eee;
  margin-bottom: 5px;
}
header p {
  font-size: 0.78rem;
  color: #555;
}

/* ── Carousel ── */
.ig-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: min(540px, 90vw);
}

.ig-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.ig-frame {
  flex: 1;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 14px;
  position: relative;
}

.ig-track {
  display: flex;
  width: 800%;
  height: 100%;
  transition: transform 0.38s cubic-bezier(.4, 0, .2, 1);
}

.ig-item {
  flex: 0 0 12.5%;
  height: 100%;
  overflow: hidden;
  position: relative;
}

/* Slides are rendered at 1080×1080 (Instagram native) and scaled to fill the frame via transform. */
.sl-scale {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
  /* transform: scale(X) applied by JS */
}

.sl {
  width: 1080px;
  height: 1080px;
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  font-family: 'Outfit', sans-serif;
}

/* ── Arrows ── */
.arrow {
  background: none;
  border: 1px solid #2a2a2a;
  color: #555;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  transition: border-color .2s, color .2s;
  user-select: none;
}
.arrow:hover:not(:disabled) { border-color: #9b5de5; color: #9b5de5; }
.arrow:disabled { opacity: 0.2; cursor: default; }

/* ── Dots ── */
.ig-dots {
  display: flex;
  gap: 7px;
  align-items: center;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #2e2e2e;
  cursor: pointer;
  transition: background .22s, transform .22s;
}
.dot.active {
  background: #9b5de5;
  transform: scale(1.25);
}
</style>
</head>
<body>

<header>
  <div class="pilar-label">Pilar 6 · Gobernanza de la IA</div>
  <h2>Gobernanza de la IA — Cruces Decorativas</h2>
  <p>Template de referencia · Paleta Lavanda + Lila Suave · Outfit · 8 slides · 1080×1080 px</p>
</header>

<div class="ig-wrap">
  <div class="ig-row">
    <button class="arrow" id="prev" disabled>&#8592;</button>
    <div class="ig-frame" id="frame">
      <div class="ig-track" id="track"></div>
    </div>
    <button class="arrow" id="next">&#8594;</button>
  </div>
  <div class="ig-dots" id="dots"></div>
</div>

<script>
const C = { bg1:'#f0e8ff', bg2:'#e4d4ff', acc:'#9b5de5', txt:'#1a1a1a', wht:'#ffffff' };

// Cross marks at 1080px scale: 80×80 SVG at 54px from each corner
const crossAcc = `
  <svg style="position:absolute;top:54px;left:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>
  <svg style="position:absolute;top:54px;right:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>
  <svg style="position:absolute;bottom:54px;left:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>
  <svg style="position:absolute;bottom:54px;right:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>`;

const crossAccSoft = `
  <svg style="position:absolute;top:54px;left:54px;opacity:.25" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>
  <svg style="position:absolute;top:54px;right:54px;opacity:.25" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>
  <svg style="position:absolute;bottom:54px;left:54px;opacity:.25" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>
  <svg style="position:absolute;bottom:54px;right:54px;opacity:.25" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="${C.acc}" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="${C.acc}" stroke-width="5"/></svg>`;

const crossWht = `
  <svg style="position:absolute;top:54px;left:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="white" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="white" stroke-width="5"/></svg>
  <svg style="position:absolute;top:54px;right:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="white" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="white" stroke-width="5"/></svg>
  <svg style="position:absolute;bottom:54px;left:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="white" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="white" stroke-width="5"/></svg>
  <svg style="position:absolute;bottom:54px;right:54px;opacity:.4" width="80" height="80" viewBox="0 0 80 80"><line x1="40" y1="8" x2="40" y2="72" stroke="white" stroke-width="5"/><line x1="8" y1="40" x2="72" y2="40" stroke="white" stroke-width="5"/></svg>`;

const slides = [
  // 1 · Portada — lavanda clara, cruces acc
  `<div class="sl" style="background:${C.bg1};padding:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:32px">
    ${crossAcc}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:32px">
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:${C.acc};font-weight:300">Pilar 6 · Gobernanza de la IA</div>
      <div style="font-size:5.4rem;font-weight:700;color:${C.txt};line-height:1.1">La Ley de IA de la UE: el primer intento serio del mundo</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.2rem;color:${C.txt};opacity:.7;line-height:1.45">¿Es suficiente? ¿Llega a tiempo?</div>
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:${C.acc};font-weight:300;margin-top:8px">@unpibedecompu</div>
    </div>
  </div>`,

  // 2 · El Problema — lavanda profunda, cruces acc soft
  `<div class="sl" style="background:${C.bg2};padding:86px;display:flex;flex-direction:column;justify-content:center;gap:54px">
    ${crossAccSoft}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:54px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc};font-weight:300">por qué importa</div>
      <div style="font-size:4.2rem;font-weight:700;color:${C.txt};line-height:1.25">Sin reglas, el mercado optimiza velocidad — no seguridad</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">Cuando los modelos más poderosos los desarrollan empresas privadas en carrera, nadie tiene incentivo para frenar. La regulación es el único mecanismo externo disponible.</div>
    </div>
  </div>`,

  // 3 · Qué Propone — lavanda clara, cruces acc soft
  `<div class="sl" style="background:${C.bg1};padding:86px;display:flex;flex-direction:column;justify-content:center;gap:54px">
    ${crossAccSoft}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:54px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc};font-weight:300">qué propone</div>
      <div style="font-size:4.2rem;font-weight:700;color:${C.txt};line-height:1.25">Clasifica los sistemas de IA por nivel de riesgo. Los de "riesgo inaceptable" quedan prohibidos.</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">Incluye obligaciones de transparencia, auditorías y supervisión humana para sistemas de alto riesgo. Aprobada en 2024. En vigor desde 2025.</div>
    </div>
  </div>`,

  // 4 · Lo Que No Alcanza — lavanda profunda, cruces acc soft
  `<div class="sl" style="background:${C.bg2};padding:86px;display:flex;flex-direction:column;justify-content:center;gap:54px">
    ${crossAccSoft}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:54px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc};font-weight:300">lo que no alcanza</div>
      <div style="font-size:4.2rem;font-weight:700;color:${C.txt};line-height:1.25">Regula aplicaciones — no el desarrollo de modelos base</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">Es como regular los autos pero no las fábricas. Los modelos más peligrosos no están directamente regulados. La carrera sigue.</div>
    </div>
  </div>`,

  // 5 · El Modelo Que Funciona — lavanda clara, cruces acc soft
  `<div class="sl" style="background:${C.bg1};padding:86px;display:flex;flex-direction:column;justify-content:center;gap:54px">
    ${crossAccSoft}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:54px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc};font-weight:300">el modelo que funciona</div>
      <div style="font-size:4.2rem;font-weight:700;color:${C.txt};line-height:1.25">El OIEA inspecciona instalaciones nucleares en 178 países. Nadie propone algo equivalente para la IA.</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">La razón por la que la tecnología nuclear no acabó con la civilización no es la suerte. Es décadas de difícil diplomacia y verificación internacional.</div>
    </div>
  </div>`,

  // 6 · Cita — lavanda profunda, cruces acc soft
  `<div class="sl" style="background:${C.bg2};padding:86px;display:flex;flex-direction:column;justify-content:center;gap:43px">
    ${crossAccSoft}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:43px">
      <div style="font-size:9.7rem;font-weight:900;color:${C.acc};opacity:.2;line-height:1">"</div>
      <div style="font-size:3.9rem;font-weight:600;color:${C.txt};line-height:1.6;font-style:italic">Necesitamos un organismo internacional para la IA, con el poder real de ralentizar o detener el desarrollo de sistemas que representen riesgos existenciales.</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:2.7rem;letter-spacing:.1em;text-transform:uppercase;color:${C.acc};font-weight:300">Yoshua Bengio · Université de Montréal</div>
    </div>
  </div>`,

  // 7 · Para Pensar — lavanda clara, cruces acc soft
  `<div class="sl" style="background:${C.bg1};padding:86px;display:flex;flex-direction:column;justify-content:center;gap:54px">
    ${crossAccSoft}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:54px">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc};font-weight:300">para pensar</div>
      <div style="font-size:4.2rem;font-weight:700;color:${C.txt};line-height:1.25">Si la Ley de IA ya tardó más de cuatro años en aprobarse, ¿cuánto tardará la siguiente?</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.75;line-height:1.7">Y en ese tiempo, ¿cuántos sistemas más poderosos se habrán desplegado sin ningún marco de supervisión real?</div>
    </div>
  </div>`,

  // 8 · CTA — violeta acento, cruces blanco
  `<div class="sl" style="background:${C.acc};padding:86px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:48px">
    ${crossWht}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:48px;text-align:center">
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:300">próxima entrega</div>
      <div style="font-size:4.86rem;font-weight:700;color:${C.wht};line-height:1.2">¿Cómo se ve una supervisión que realmente funcione?</div>
      <div style="width:130px;height:8px;background:rgba(255,255,255,.5)"></div>
      <div style="font-size:3.1rem;color:${C.wht};opacity:.75;line-height:1.5;max-width:750px">Seguí la serie de Gobernanza de la IA para entender qué se necesita y qué falta</div>
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.9);margin-top:16px">@unpibedecompu</div>
    </div>
  </div>`
];

const frame   = document.getElementById('frame');
const track   = document.getElementById('track');
const dotsEl  = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let current = 0;
const total = slides.length;

// Build slides
slides.forEach(html => {
  const item = document.createElement('div');
  item.className = 'ig-item';
  const scaler = document.createElement('div');
  scaler.className = 'sl-scale';
  scaler.innerHTML = html;
  item.appendChild(scaler);
  track.appendChild(item);
});

// Build dots
for (let i = 0; i < total; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}

function applyScale() {
  const fw = frame.offsetWidth;
  const scale = fw / 1080;
  document.querySelectorAll('.sl-scale').forEach(el => {
    el.style.transform = `scale(${scale})`;
  });
}

function goTo(index) {
  current = Math.max(0, Math.min(index, total - 1));
  track.style.transform = `translateX(-${current * (100 / total)}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo(current - 1);
  if (e.key === 'ArrowRight') goTo(current + 1);
});

applyScale();
window.addEventListener('resize', applyScale);
goTo(0);
</script>
</body>
</html>
