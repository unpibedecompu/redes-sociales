  overflow: hidden;

.ig-track {

.sl-scale {

.sl {

.arrow:hover:not(:disabled) { border-color: #9b5de5; color: #9b5de5; }
.arrow:disabled { opacity: 0.2; cursor: default; }

.ig-dots { display: flex; gap: 7px; align-items: center; }
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #2e2e2e;
  cursor: pointer;

    <div style="position:relative;z-index:2;display:flex;flex-direction:column;gap:40px">

  // 11 · CTA
  `<div class="sl" style="background:${C.acc};padding:86px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:48px">
    ${crossWht}
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:48px;text-align:center">
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:300">seguí aprendiendo</div>
      <div style="font-size:4.6rem;font-weight:700;color:${C.wht};line-height:1.2">La tecnología no espera. Las instituciones, sí.</div>

      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.9);margin-top:10px">@unpibedecompu</div>
    </div>
  </div>`

];

const frame   = document.getElementById('frame');
const track   = document.getElementById('track');
const dotsEl  = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let current = 0;
const total = slides.length;

slides.forEach(html => {
  const item = document.createElement('div');
  item.className = 'ig-item';
  const scaler = document.createElement('div');
  scaler.className = 'sl-scale';
  scaler.innerHTML = html;
  item.appendChild(scaler);
  track.appendChild(item);
});

for (let i = 0; i < total; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}

function applyScale() {
  const fw = frame.offsetWidth;
  const scale = fw / 1080;
  document.querySelectorAll('.sl-scale').forEach(el => {
    el.style.transform = `scale(${scale})`;
  });
}

function goTo(index) {
  current = Math.max(0, Math.min(index, total - 1));
  track.style.transform = `translateX(-${current * (100 / total)}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo(current - 1);
  if (e.key === 'ArrowRight') goTo(current + 1);
});

applyScale();
window.addEventListener('resize', applyScale);
goTo(0);
</script>
