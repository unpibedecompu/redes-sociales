<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena 7 Pérdida de control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #2A2A28;
    color: #FAF9F5;
    font-family: Tahoma, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  /* reel completo 1080x1920 */
  svg#escena {
    width: 100%;
    max-width: 1080px;
    max-height: calc(100vh - 90px);
    aspect-ratio: 1080 / 1920;
    display: block;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #3A3A37;
    color: #FAF9F5;
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: #D97757; border-color: #D97757; }
  /* para el render: ?t=... muestra solo el cuadro, sin controles */
  body.fijo { padding: 0; }
  body.fijo svg#escena { max-height: none; }
  body.fijo .controls { display: none; }
</style>
</head>
<body>

<!--
  Riesgo 3, pérdida de control: "...donde quedaríamos a merced de la voluntad de una IA."
  Datacenter: de fondo una pared de racks, baliza roja. Yoshua, de cuerpo entero, camina despacio para atrás
  mientras aprieta una y otra vez el botón rojo de apagado de emergencia de la pared. El robot entra por la derecha
  y se le va acercando despacio, de costado y con los brazos quietos, pero se frena sin llegar a tocarlo.
-->
<svg id="escena" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs">
    <radialGradient id="baliza-luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3B30" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="robot-luz" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5CE1F0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5CE1F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A242E"/>
      <stop offset="1" stop-color="#2C3A47"/>
    </linearGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="grano" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.9"/></feComponentTransfer>
    </filter>
    <!-- sin el brazo izquierdo (del cuadro) del editor: el que aprieta el botón se dibuja aparte -->
    <clipPath id="sin-brazo" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M-50 -50 H450 V950 H-50 Z M-50 326 L123 326 L123 600 L-50 600 Z"/>
    </clipPath>
  </defs>

  <g id="camara">
    <rect x="-400" y="-400" width="2000" height="3100" fill="#0B1015"/>
    <!-- pared de racks y piso -->
    <g id="racks" class="papel"></g>
    <g id="leds"></g>
    <rect x="-400" y="1560" width="2000" height="1140" fill="url(#piso)"/>
    <g id="baldosas" stroke="#3A4B5A" stroke-width="4"></g>

    <!-- columna de la pared con el botón de emergencia -->
    <g class="papel">
      <rect x="-40" y="-400" width="245" height="1960" fill="#3A444E"/>
      <rect x="185" y="-400" width="20" height="1960" fill="#2A323A"/>
      <!-- cartel -->
      <rect x="45" y="880" width="140" height="56" rx="4" fill="#E0B341"/>
      <!-- caja del botón -->
      <rect x="40" y="980" width="150" height="170" rx="8" fill="#E0B341"/>
      <rect x="40" y="1135" width="150" height="15" rx="4" fill="#B88E22"/>
      <!-- baliza -->
      <rect x="80" y="640" width="70" height="22" rx="4" fill="#2E3740"/>
    </g>
    <text x="115" y="918" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold" font-size="30" fill="#141413">STOP</text>
    <path id="baliza-domo" d="M88 640 Q88 586 115 586 Q142 586 142 640 Z" fill="#FF6B5E"/>
    <circle id="baliza-brillo" cx="115" cy="620" r="560" fill="url(#baliza-luz)" style="mix-blend-mode:screen"/>
    <!-- el botón rojo -->
    <g id="boton"></g>

    <!-- el robot, entrando por la derecha -->
    <circle id="robot-brillo" r="460" fill="url(#robot-luz)" style="mix-blend-mode:screen"/>
    <g id="robot"></g>

    <!-- Yoshua -->
    <ellipse id="yoshua-sombra" rx="190" ry="26" fill="#000" opacity="0.4"/>
    <g id="yoshua"></g>
    <g id="mano"></g>
  </g>

  <rect width="1080" height="1920" fill="url(#vineta)"/>
  <rect id="flash" width="1080" height="1920" fill="#FF3B30" opacity="0" style="mix-blend-mode:screen" pointer-events="none"/>
  <rect width="1080" height="1920" filter="url(#grano)" opacity="0.14" style="mix-blend-mode:multiply" pointer-events="none"/>
</svg>

<div class="controls" role="group" aria-label="Vista">
  <button data-mode="anim" aria-pressed="true">Animación</button>
  <button data-mode="inicio" aria-pressed="false">Cuadro inicial</button>
  <button data-mode="final" aria-pressed="false">Cuadro final</button>
</div>

<script src="../../../../../animations/paper_cutoff_characters/parts.js"></script>
<script src="../../../../../animations/paper_cutoff_characters/personajes.js"></script>
<script src="personajes.js"></script>
<script src="robot.js"></script>
<script>
  // "Y riesgo de pérdida de control, donde quedaríamos a merced de la voluntad de una IA."
  const DURATION = 5;
  const FPS_PAPEL = 12;

  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };

  // filtros del editor (sombra, corte irregular) dentro de nuestro <defs>
  const tmp = document.createElementNS(NS, "svg");
  tmp.innerHTML = PERSONAJES.defs;
  for (const n of [...tmp.querySelectorAll("defs > *")]) $("defs").appendChild(n);
  const estilo = tmp.querySelector("style");
  if (estilo) $("escena").insertBefore(estilo, $("defs"));
  document.querySelectorAll(".papel").forEach(g => g.setAttribute("filter", "url(#corte)"));

  let semilla = 73;
  const rnd = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const mod = (a, n) => ((a % n) + n) % n;   // módulo que no da negativo (t < 0 en las colas para editar)
  const tramo = (t, a, b) => clamp01((t - a) / (b - a));
  const suave = x => x * x * (3 - 2 * x);
  const lerp = (a, b, k) => a + (b - a) * k;
  const capa = html => `<g class="capa" filter="url(#sombra)">${html}</g>`;

  // ---- pared de racks (de frente) con leds ----
  const leds = [];
  for (let i = 0; i < 6; i++) {     // 6 racks: el plano abierto deja ver más pared a la derecha
    const x = 215 + i * 196, y = 100, w = 180, h = 1460;
    el("rect", { x, y, width: w, height: h, fill: "#161C22" }, $("racks"));
    for (let u = 0; u < 25; u++) {
      const yy = y + 24 + u * 57;
      const rejilla = u % 4 === 3;
      el("rect", { x: x + 12, y: yy, width: w - 24, height: 47, fill: rejilla ? "#10151B" : "#1D252D" }, $("racks"));
      if (!rejilla) for (let j = 0; j < 3; j++)
        leds.push({ c: el("circle", { cx: x + 28 + j * 16, cy: yy + 23, r: 4.5 }, $("leds")), fase: rnd(), vel: 2 + rnd() * 6 });
    }
  }
  // baldosas del piso técnico, en perspectiva hacia el fondo
  for (const y of [1600, 1665, 1760, 1900, 2090, 2350]) el("line", { x1: -400, y1: y, x2: 1600, y2: y }, $("baldosas"));
  for (let i = -5; i <= 9; i++) el("line", { x1: 540 + (i - 2) * 200, y1: 1560, x2: 540 + (i - 2) * (200 + 220 * 1140 / 360), y2: 2700 }, $("baldosas"));

  // ---- botón rojo de la pared, de frente: al apretarlo se achica y se oscurece ----
  const BX = 115, BY = 1060;
  function dibujarBoton(hundido) {
    const r = hundido ? 46 : 54;
    $("boton").innerHTML = `<g filter="url(#corte)">` +
      capa(`<circle cx="${BX}" cy="${BY}" r="62" fill="#141413"/>`) +
      capa(`<circle cx="${BX}" cy="${BY + (hundido ? 0 : 6)}" r="${r}" fill="#9E1F18"/>` +
           `<circle cx="${BX}" cy="${BY}" r="${r}" fill="${hundido ? "#B8281F" : "#E3352B"}"/>` +
           `<path d="M${BX - 14} ${BY - 10} A 20 20 0 1 0 ${BX + 14} ${BY - 10}" fill="none" stroke="#FAF9F5" stroke-width="6" stroke-linecap="round"/>` +
           `<path d="M${BX} ${BY - 26} L${BX} ${BY - 4}" stroke="#FAF9F5" stroke-width="6" stroke-linecap="round"/>`) +
      `</g>`;
    return BX + 6;     // x donde apoya la mano
  }

  // ---- Yoshua de cuerpo entero: los pies del editor (y=800) en (yx, PIES) ----
  const ESC_Y = 1.55, PIES = 1790;
  const aEscena = (yx, x, y) => [yx + (x - 200) * ESC_Y, PIES + (y - 800) * ESC_Y];
  let ultimoYoshua = "";
  function dibujarYoshua(opts) {
    const clave = JSON.stringify(opts);
    if (clave === ultimoYoshua) return;
    ultimoYoshua = clave;
    $("yoshua").innerHTML =
      `<g transform="translate(${-200 * ESC_Y} ${-800 * ESC_Y}) scale(${ESC_Y})">` +
      `<g clip-path="url(#sin-brazo)">${PERSONAJES.armar("yoshua", opts)}</g></g>`;
  }

  // brazo que aprieta: hombro -> codo -> mano, con el codo hacia abajo (dos tramos de manga del traje)
  const BRAZO = 190, ANTEBRAZO = 190;
  function dibujarBrazo([hx, hy], [mx, my]) {
    const d = Math.min(Math.hypot(mx - hx, my - hy), BRAZO + ANTEBRAZO - 1);
    const a = Math.atan2(my - hy, mx - hx);
    const b = Math.acos((BRAZO * BRAZO + d * d - ANTEBRAZO * ANTEBRAZO) / (2 * BRAZO * d));
    // de las dos soluciones, el codo que queda más abajo
    const codos = [a - b, a + b].map(g => [hx + BRAZO * Math.cos(g), hy + BRAZO * Math.sin(g)]);
    const [ex, ey] = codos[0][1] > codos[1][1] ? codos[0] : codos[1];
    // si no llega, la mano queda en la punta del brazo estirado
    if (Math.hypot(mx - hx, my - hy) > d) { mx = hx + (mx - hx) * d / Math.hypot(mx - hx, my - hy); my = hy + (my - hy) * d / Math.hypot(mx - hx, my - hy); }
    const tramoManga = (x1, y1, x2, y2, w1, w2) => {
      const g = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
      const c = Math.cos(g), s = Math.sin(g);
      return `<path d="M${x1 + c * w1} ${y1 + s * w1} L${x2 + c * w2} ${y2 + s * w2} L${x2 - c * w2} ${y2 - s * w2} L${x1 - c * w1} ${y1 - s * w1} Z" fill="#24569A"/>`;
    };
    const g = Math.atan2(my - ey, mx - ex);
    const px = mx - Math.cos(g) * 26, py = my - Math.sin(g) * 26;
    $("mano").innerHTML = `<g filter="url(#corte)">` +
      capa(tramoManga(hx, hy, ex, ey, 34, 30) + `<circle cx="${ex}" cy="${ey}" r="30" fill="#24569A"/>`) +
      capa(tramoManga(ex, ey, px, py, 30, 27) +
           `<path d="M${px - 26} ${py - 6} L${px + 26} ${py - 6} L${px + 26} ${py + 6} L${px - 26} ${py + 6} Z" fill="#EEF2F6" transform="rotate(${g * 180 / Math.PI + 90} ${px} ${py})"/>`) +
      capa(`<circle cx="${mx}" cy="${my}" r="28" fill="#E8B48A"/><ellipse cx="${mx - 6}" cy="${my + 8}" rx="16" ry="13" fill="#C98F66"/>`) +
      `</g>`;
  }

  // apretones: cada vez más seguidos
  const APRIETA = [0.4, 0.95, 1.45, 1.9, 2.3, 2.65, 2.97, 3.27, 3.55, 3.8, 4.05, 4.3, 4.55];
  const DURA = 0.13;
  const ultimoApreton = tp => APRIETA.filter(a => a <= tp).pop();

  function render(t) {
    const cuadro = Math.floor(t * FPS_PAPEL);
    const tp = cuadro / FPS_PAPEL;
    const k = mod(cuadro, 3);

    const turb = document.querySelector("#corte feTurbulence");
    if (turb) turb.setAttribute("seed", [7, 19, 42][k]);

    const ap = ultimoApreton(tp);
    const hundido = ap !== undefined && tp - ap < DURA;
    const golpe = hundido && tp - ap < 1 / FPS_PAPEL;

    // cámara: se acerca de a poco; un sacudón chico en cada apretón
    // plano abierto (0.8): los pies de Yoshua quedan arriba de la descripción del overlay de IG (y ≈ 1575);
    // el zoom pivota en los pies, así no bajan al acercarse
    const z = 0.8 * (1 + 0.08 * suave(clamp01(t / DURATION)));
    const sx = golpe ? [5, -4, 3][k] : 0;
    $("camara").setAttribute("transform", `translate(${sx} 0) translate(280 1500) scale(${z}) translate(-300 -1790)`);

    // leds y baliza
    for (const l of leds) {
      const on = Math.sin((tp + l.fase * 3) * l.vel) > -0.2;
      l.c.setAttribute("fill", on ? (l.fase > 0.85 ? "#E0B341" : "#5CF08A") : "#1F3A2A");
    }
    const pulso = 0.5 + 0.5 * Math.sin(tp * 7);
    $("baliza-brillo").setAttribute("opacity", (0.25 + 0.75 * pulso).toFixed(3));
    $("baliza-domo").setAttribute("fill", pulso > 0.5 ? "#FF6B5E" : "#C22D24");
    $("flash").setAttribute("opacity", (0.06 * pulso).toFixed(3));

    // Yoshua camina para atrás (hacia la pared), cada vez más despacio; balanceo de papel al dar cada paso
    const anda = 1 - Math.pow(1 - Math.min(tp / DURATION, 1), 2);   // después del final se queda contra la pared
    const paso = mod(Math.floor(tp * 3), 2);                      // un paso cada 1/3 s
    const yx = lerp(590, 470, anda);
    const inclina = (paso ? 2 : -2) + (hundido ? -3 : 0);    // se tira para atrás al apretar
    const sube = mod(Math.floor(tp * 6), 2) * -8;
    dibujarYoshua({ cejas: 4, boca: tp > 2.6 ? 2 : 1, mirar: 1, parpadeo: tp > 1.7 && tp < 1.8 });
    $("yoshua").setAttribute("transform", `translate(${yx} ${PIES + sube}) rotate(${inclina})`);
    $("yoshua-sombra").setAttribute("cx", yx);
    $("yoshua-sombra").setAttribute("cy", PIES + 10);

    // hombro izquierdo (del cuadro) en coordenadas de escena, siguiendo el balanceo
    const [hx0, hy0] = aEscena(0, 122, 334);
    const r = inclina * Math.PI / 180, dy = hy0 - PIES;
    const hombro = [yx + hx0 * Math.cos(r) - dy * Math.sin(r), PIES + sube + hx0 * Math.sin(r) + dy * Math.cos(r)];

    // botón y mano: entre apretón y apretón la mano se separa de la tapa
    const cara = dibujarBoton(hundido);
    const sig = APRIETA.find(a => a > tp);
    let sep = hundido ? 0 : 1;
    if (!hundido && sig !== undefined && sig - tp < 1 / FPS_PAPEL + 0.001) sep = 0.5;   // bajando
    dibujarBrazo(hombro, [cara + 50 * sep, BY - 60 * sep]);

    // robot: entra por la derecha y se acerca de costado, despacio y a los tirones (stop motion),
    // con los brazos quietos; se frena sin tocar a Yoshua
    const q = tramo(tp, 0, 4.6);
    const S = 1.45;     // más chico que Yoshua y lejos del borde: no se mete abajo de los botones de Instagram
    const cx = lerp(1130, 840, 1 - Math.pow(1 - q, 1.6)), cy = 900 + [0, -3, -1, -4, 0, -2][mod(cuadro, 6)] * S;
    $("robot").innerHTML = ROBOT.svg({ cx, cy, S, mirarX: -1, mirarY: 0.3, llama: [1, 0.8, 0.9][k] });
    $("robot-brillo").setAttribute("cx", cx);
    $("robot-brillo").setAttribute("cy", cy);
  }

  // ---- controles / modo render ----
  let mode = "anim", start = performance.now();
  function loop(now) {
    if (mode === "anim") render(((now - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  }
  document.querySelectorAll(".controls button").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode; start = performance.now();
    document.querySelectorAll(".controls button").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (mode === "inicio") render(0);
    if (mode === "final") render(DURATION - 0.001);
  }));
  const fixed = new URLSearchParams(location.search).get("t");
  if (fixed !== null) { mode = "fijo"; document.body.classList.add("fijo"); render(Number(fixed)); }
  else { render(0); requestAnimationFrame(loop); }
</script>
</body>
</html>
