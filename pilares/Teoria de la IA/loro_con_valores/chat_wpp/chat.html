<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat WhatsApp</title>
<style>
  :root {
    --header: #075e54;
    --header-text: #ffffff;
    --chat-bg: #efeae2;
    --doodle: rgba(0, 0, 0, 0.05);
    --out-bubble: #d9fdd3;
    --text: #111b21;
    --meta: #667781;
    --tick: #53bdeb;
    --input-bg: #ffffff;
    --accent: #00a884;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1f1f1f;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Phone canvas: 9:16, sized for recording / exporting */
  .phone {
    width: 430px; height: 932px;
    background: var(--chat-bg);
    display: flex; flex-direction: column;
    overflow: hidden;
    border-radius: 28px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    position: relative;
  }

  .statusbar {
    height: 34px; background: var(--header); color: var(--header-text);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 14px; font-weight: 600;
  }
  .statusbar .icons { display: flex; gap: 6px; align-items: center; }

  .header {
    height: 64px; background: var(--header); color: var(--header-text);
    display: flex; align-items: center; gap: 10px; padding: 0 12px 0 6px;
  }
  .header .back { width: 28px; height: 28px; flex: none; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    background: #dfe5e7 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 17px;
  }
  .who { flex: 1; min-width: 0; }
  .who .name { font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .status { font-size: 13px; opacity: .85; }
  .actions { display: flex; gap: 22px; }
  .actions svg { width: 24px; height: 24px; }

  .chat {
    flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px;
    background-color: var(--chat-bg);
    background-image:
      radial-gradient(circle at 20px 20px, var(--doodle) 3px, transparent 4px),
      radial-gradient(circle at 60px 50px, var(--doodle) 2px, transparent 3px),
      radial-gradient(circle at 40px 80px, var(--doodle) 4px, transparent 5px);
    background-size: 90px 100px;
    justify-content: flex-start;
  }
  .day {
    align-self: center; background: #fff; color: var(--meta);
    font-size: 17px; padding: 6px 16px; border-radius: 8px; margin-bottom: 10px;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
  }

  .msg {
    align-self: flex-end; max-width: 80%;
    background: var(--out-bubble); color: var(--text);
    border-radius: 8px; padding: 6px 8px 8px 9px;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
    position: relative; font-size: 24px; line-height: 1.3;
  }
  .msg.tail { border-top-right-radius: 0; margin-top: 6px; }
  .msg.tail::after {
    content: ""; position: absolute; top: 0; right: -8px;
    border-left: 8px solid var(--out-bubble);
    border-bottom: 10px solid transparent;
  }
  .msg .meta {
    float: right; margin: 10px 0 -5px 12px;
    font-size: 17px; color: var(--meta);
    display: inline-flex; align-items: center; gap: 3px;
  }
  .ticks { width: 25px; height: 16px; }

  .msg.image { padding: 3px; }
  .msg.image img {
    display: block; width: 300px; height: 245px; object-fit: cover; border-radius: 6px;
  }
  .msg.image .meta {
    position: absolute; right: 9px; bottom: 7px; margin: 0; float: none;
    color: #fff; text-shadow: 0 0 4px rgba(0,0,0,.6);
  }
  .msg.image .ticks path { stroke: #fff; }

  /* Header status while recording */
  .who .status.recording { color: #ffffff; }
  .rec-dots span { animation: blink 1.2s infinite; opacity: 0; }
  .rec-dots span:nth-child(2) { animation-delay: .2s; }
  .rec-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 100% { opacity: 0; } 30%, 70% { opacity: 1; } }

  /* Incoming voice note */
  .msg.in {
    align-self: flex-start; background: #ffffff;
  }
  .msg.in.tail { border-top-left-radius: 0; border-top-right-radius: 8px; }
  .msg.in.tail::after {
    right: auto; left: -8px;
    border-left: none; border-right: 8px solid #ffffff;
  }
  .msg.voice {
    width: 340px; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px 8px 10px;
    animation: pop .28s cubic-bezier(.2, .9, .3, 1.2);
    transform-origin: top left;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.85) translateY(10px); } to { opacity: 1; transform: none; } }
  .v-avatar {
    width: 64px; height: 64px; border-radius: 50%; flex: none; position: relative;
    background: #dfe5e7 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 26px;
  }
  .v-mic {
    position: absolute; left: -6px; bottom: -3px; width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .v-mic svg { width: 26px; height: 26px; fill: #00a884; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff); transition: fill .2s; }
  .v-mic.played svg { fill: #53bdeb; }
  /* Bottom padding = footer height, so the icon centers on the waveform row */
  .v-play { width: 44px; height: 67px; padding-bottom: 23px; flex: none; display: flex; align-items: center; justify-content: center; }
  .v-play svg { width: 40px; height: 40px; fill: #8696a0; }
  .v-play .i-pause { display: none; }
  .v-play.playing .i-play { display: none; }
  .v-play.playing .i-pause { display: block; }
  .v-body { flex: 1; min-width: 0; }
  .v-wave {
    position: relative; height: 44px; display: flex; align-items: center; gap: 2px;
  }
  .v-wave .bar { flex: 1; min-height: 4px; border-radius: 2px; background: #b6bfc4; }
  .v-wave .bar.on { background: #53bdeb; }
  .v-dot {
    position: absolute; top: 50%; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%; background: #00a884; z-index: 1;
  }
  .v-dot.played { background: #53bdeb; }
  .v-foot {
    display: flex; justify-content: space-between; font-size: 17px; line-height: 22px;
    color: var(--meta); margin-top: 1px;
  }

  [hidden] { display: none !important; }

  /* Video export: phone fills the frame */
  body.render { display: block; }
  body.render .phone { border-radius: 0; box-shadow: none; width: 100vw; height: 100vh; }

  /* Incoming "typing" bubble shown while the contact records */
  .msg.typing {
    display: flex; gap: 7px; align-items: center; padding: 20px 22px;
    animation: pop .2s ease-out;
  }
  .msg.typing span {
    width: 12px; height: 12px; border-radius: 50%; background: #8696a0;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .msg.typing span:nth-child(2) { animation-delay: .15s; }
  .msg.typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  .composer {
    display: flex; align-items: center; gap: 6px; padding: 8px 8px 22px;
    background: transparent;
  }
  .composer .field {
    flex: 1; height: 50px; background: var(--input-bg); border-radius: 25px;
    display: flex; align-items: center; gap: 12px; padding: 0 14px;
    color: var(--meta); font-size: 17px;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
  }
  .composer .field span { flex: 1; }
  .composer .field svg { width: 24px; height: 24px; fill: var(--meta); }
  .mic {
    width: 50px; height: 50px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .mic svg { width: 24px; height: 24px; fill: #fff; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span id="clock">15:52</span>
    <span class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.3" y="5.5" width="3" height="6.5" rx="1"/><rect x="8.6" y="3" width="3" height="9" rx="1"/><rect x="12.9" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="#fff"/><rect x="2" y="2" width="15" height="8" rx="2" fill="#fff"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#fff"/></svg>
    </span>
  </div>

  <div class="header">
    <svg class="back" viewBox="0 0 24 24" fill="#fff"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    <div class="avatar" id="avatar"></div>
    <div class="who">
      <div class="name" id="name">Amigo</div>
      <div class="status">en línea</div>
    </div>
    <div class="actions">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
      <svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </div>
  </div>

  <div class="chat">
    <div class="day">HOY</div>

    <div class="msg tail">
      ¿Qué te parece la taza de cerámica que hice?
      <span class="meta"><span class="time">15:52</span>
        <svg class="ticks" viewBox="0 0 17 11"><path d="M1 6l3 3 6-7M7 9l1 0 6-7" fill="none" stroke="#53bdeb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>

    <div class="msg image">
      <img src="../images/taza.png" alt="Taza de cerámica">
      <span class="meta"><span class="time">15:52</span>
        <svg class="ticks" viewBox="0 0 17 11"><path d="M1 6l3 3 6-7M7 9l1 0 6-7" fill="none" stroke="#53bdeb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>

    <!-- Shown while the contact is recording -->
    <div class="msg in typing tail" id="typing" hidden><span></span><span></span><span></span></div>

    <!-- Incoming voice note, revealed by the animation -->
    <div class="msg in voice tail" id="voice" hidden>
      <div class="v-avatar" id="vAvatar">
        <span class="v-mic" id="vMic"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg></span>
      </div>
      <div class="v-play" id="vPlay">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="14" y="4" width="4.5" height="16" rx="1.2"/></svg>
      </div>
      <div class="v-body">
        <div class="v-wave" id="vWave"><span class="v-dot" id="vDot"></span></div>
        <div class="v-foot"><span id="vDur">0:02</span><span class="time">15:53</span></div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-3.5 6a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 18a6 6 0 0 1-5.2-3h10.4A6 6 0 0 1 12 18z"/></svg>
      <span>Mensaje</span>
      <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.2"/><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    </div>
    <div class="mic">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>
    </div>
  </div>
</div>

<script>
  // Configurable via URL: chat.html?contact=Mejor%20amigo&avatar=../images/foto.png&time=15:52
  const params = new URLSearchParams(location.search);
  const contact = params.get("contact") || "Amigo";
  const avatar = params.get("avatar");
  const time = params.get("time");

  document.getElementById("name").textContent = contact;
  const initials = contact.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  let hue = 0; for (const c of contact) hue = (hue * 31 + c.charCodeAt(0)) % 360;
  for (const av of [document.getElementById("avatar"), document.getElementById("vAvatar")]) {
    if (avatar) {
      av.style.backgroundImage = `url("${avatar}")`;
    } else {
      // Initials on a color derived from the name
      av.style.backgroundColor = `hsl(${hue} 45% 52%)`;
      av.insertBefore(document.createTextNode(initials), av.firstChild);
    }
  }

  // ---- Voice note animation: ?audio=../edicion/amigo.mp4 ----
  // Click (or press space) to run: recording → voice note arrives → playback.
  //   &record=ms  how long "grabando audio" lasts
  //   &dur=s      displayed duration of the note; if longer than the audio, the
  //               dot moves slower and freezes mid-way when the audio cuts off
  //   &render=1   video export mode: no sound, no scaling, driven by performance.now()
  const audioSrc = params.get("audio");
  const recordMs = Number(params.get("record") || 2200);
  const renderMode = params.has("render");
  const statusEl = document.querySelector(".who .status");
  const voice = document.getElementById("voice");
  const typing = document.getElementById("typing");
  const wave = document.getElementById("vWave");
  const dot = document.getElementById("vDot");
  const playBtn = document.getElementById("vPlay");
  const mic = document.getElementById("vMic");
  const durEl = document.getElementById("vDur");
  const BARS = 32;
  const fmt = s => `0:${String(Math.floor(s)).padStart(2, "0")}`;
  let audioDuration = 1;
  let shownDuration = Number(params.get("dur")) || 0;

  // Waveform bars from the real audio (falls back to a generic shape)
  async function buildWave() {
    let peaks = Array.from({ length: BARS }, (_, i) => 0.3 + 0.6 * Math.abs(Math.sin(i * 1.7)));
    try {
      const buf = await (await fetch(audioSrc)).arrayBuffer();
      const decoded = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(buf);
      audioDuration = decoded.duration;
      const data = decoded.getChannelData(0);
      const step = Math.floor(data.length / BARS);
      peaks = Array.from({ length: BARS }, (_, i) => {
        let sum = 0;
        for (let j = i * step; j < (i + 1) * step; j++) sum += data[j] * data[j];
        return Math.sqrt(sum / step);
      });
      const max = Math.max(...peaks) || 1;
      peaks = peaks.map(p => p / max);
    } catch (e) { console.warn("Waveform fallback:", e); }
    if (!shownDuration) shownDuration = audioDuration;
    durEl.textContent = fmt(Math.max(1, Math.round(shownDuration)));
    for (const p of peaks) {
      const b = document.createElement("span");
      b.className = "bar";
      b.style.height = `${Math.max(4, p * 40)}px`;
      wave.appendChild(b);
    }
  }

  const wait = ms => new Promise(r => setTimeout(r, ms));
  let running = false;

  async function runAnimation() {
    if (running) return;
    running = true;
    const audio = renderMode ? null : new Audio(audioSrc);

    // Reset the voice note (a cut-off run leaves it frozen mid-playback)
    voice.hidden = true;
    playBtn.classList.remove("playing");
    mic.classList.remove("played");
    dot.classList.remove("played");
    dot.style.left = "0%";
    wave.querySelectorAll(".bar").forEach(b => b.classList.remove("on"));
    durEl.textContent = fmt(Math.max(1, Math.round(shownDuration)));

    // 1) Contact is recording
    await wait(600);
    statusEl.classList.add("recording");
    statusEl.innerHTML = 'grabando audio<span class="rec-dots"><span>.</span><span>.</span><span>.</span></span>';
    typing.hidden = false;
    await wait(recordMs);
    statusEl.classList.remove("recording");
    statusEl.textContent = "en línea";

    // 2) Voice note replaces the dots
    typing.hidden = true;
    voice.hidden = false;
    await wait(1000);

    // 3) Playback
    const bars = [...wave.querySelectorAll(".bar")];
    playBtn.classList.add("playing");
    mic.classList.add("played");
    dot.classList.add("played");
    window.__audioStart = performance.now();
    if (audio) await audio.play().catch(e => console.warn(e));
    await new Promise(resolve => {
      const tick = () => {
        const t = audio ? audio.currentTime : (performance.now() - window.__audioStart) / 1000;
        const ended = audio ? audio.ended : t >= audioDuration;
        const p = Math.min(1, Math.min(t, audioDuration) / shownDuration);
        dot.style.left = `${p * 100}%`;
        bars.forEach((b, i) => b.classList.toggle("on", i / bars.length < p));
        durEl.textContent = fmt(Math.min(t, audioDuration));
        if (ended) return resolve();
        requestAnimationFrame(tick);
      };
      tick();
    });

    // Audio cut on purpose: freeze mid-playback
    if (shownDuration > audioDuration + 0.05) { window.__done = true; running = false; return; }

    // End state: like WhatsApp, reset to start with played (blue) mic
    playBtn.classList.remove("playing");
    bars.forEach(b => b.classList.remove("on"));
    dot.style.left = "0%";
    durEl.textContent = fmt(Math.max(1, Math.round(shownDuration)));
    window.__done = true;
    running = false;
  }
  window.runAnimation = runAnimation;

  if (audioSrc) {
    window.__ready = buildWave();
    if (!renderMode) {
      addEventListener("click", runAnimation);
      addEventListener("keydown", e => { if (e.code === "Space") runAnimation(); });
    }
  }

  // Scale the phone to fit the window without changing its layout
  const phone = document.querySelector(".phone");
  if (renderMode) {
    document.body.classList.add("render");
  } else {
    const fit = () => {
      const s = Math.min(1, (innerHeight - 24) / 932, (innerWidth - 24) / 430);
      phone.style.transform = `scale(${s})`;
    };
    fit(); addEventListener("resize", fit);
  }

  if (time) {
    document.querySelectorAll(".time, #clock").forEach(el => el.textContent = time);
  }
</script>
</body>
</html>
