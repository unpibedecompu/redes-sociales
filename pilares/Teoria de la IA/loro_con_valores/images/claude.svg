<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F5F0E8"/>
  <!-- Claude spark: rounded rays of uneven length around the center -->
  <g stroke="#D97757" stroke-linecap="round" transform="translate(50 50)">
    <g stroke-width="7.5">
      <line x1="0" y1="0" x2="0" y2="-32"/>
      <line x1="0" y1="0" x2="0" y2="-32" transform="rotate(33)"/>
      <line x1="0" y1="0" x2="0" y2="-27" transform="rotate(64)"/>
      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(95)"/>
      <line x1="0" y1="0" x2="0" y2="-29" transform="rotate(127)"/>
      <line x1="0" y1="0" x2="0" y2="-32" transform="rotate(158)"/>
      <line x1="0" y1="0" x2="0" y2="-28" transform="rotate(190)"/>
      <line x1="0" y1="0" x2="0" y2="-33" transform="rotate(221)"/>
      <line x1="0" y1="0" x2="0" y2="-27" transform="rotate(252)"/>
      <line x1="0" y1="0" x2="0" y2="-32" transform="rotate(284)"/>
      <line x1="0" y1="0" x2="0" y2="-29" transform="rotate(316)"/>
    </g>
    <circle r="9" fill="#D97757" stroke="none"/>
  </g>
</svg>
