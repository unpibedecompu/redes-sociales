<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena 1 Honestidad</title>
<style>
  :root {
    --ivory: #F0EEE6;
    --oat: #E3DACC;
    --slate: #141413;
    --clay: #D97757;
    --paper: #FAF9F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #2A2A28;
    color: var(--paper);
    font-family: Tahoma, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  /* 1080x640 = un tercio de 1080x1920 */
  svg#escena {
    width: 100%;
    max-width: 1080px;
    aspect-ratio: 1080 / 640;
    display: block;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #3A3A37;
    color: var(--paper);
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); }

</style>
</head>
<body>

<svg id="escena" class="anim" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg">
  <!-- pared y piso -->
  <rect width="1080" height="640" fill="#F0EEE6"/>
  <rect y="570" width="1080" height="70" fill="#E3DACC"/>

  <!-- luces de techo -->
  <g fill="#FAF9F5" stroke="#B0AEA5" stroke-width="2">
    <rect x="60" y="18" width="240" height="12"/>
    <rect x="420" y="18" width="240" height="12"/>
    <rect x="780" y="18" width="240" height="12"/>
  </g>

  <!-- góndolas (los productos se generan abajo con JS) -->
  <g id="gondolas"></g>

  <!-- primer plano: corrido 65 px a la izquierda para centrar personajes y caja -->
  <g transform="translate(-65 0)">
    <!-- caja: mostrador de acero con cinta -->
    <rect x="400" y="516" width="360" height="124" fill="#B0AEA5"/>
    <polygon points="400,516 420,490 740,490 760,516" fill="#D6D3CB"/>
    <rect x="400" y="516" width="360" height="12" fill="#3E3E3A"/>
    <g id="cinta" fill="#73736E"></g>

    <!-- registradora -->
    <rect x="650" y="464" width="80" height="30" fill="#3E3E3A"/>
    <rect x="660" y="472" width="60" height="10" fill="#B0AEA5"/>
    <rect x="686" y="420" width="8" height="44" fill="#3E3E3A"/>
    <rect x="654" y="380" width="72" height="46" fill="#3E3E3A"/>
    <rect x="662" y="388" width="56" height="30" fill="#6A9BCC"/>

    <!-- poste con cartel -->
    <rect x="770" y="110" width="10" height="380" fill="#3E3E3A"/>
    <rect x="692" y="68" width="166" height="54" rx="8" fill="#D97757"/>
    <text x="775" y="96" text-anchor="middle" dominant-baseline="central"
          font-family="Tahoma, Verdana, sans-serif" font-weight="bold" font-size="34" fill="#FAF9F5">CAJA 3</text>

    <!-- billetes -->
    <g id="billete-quieto"></g>
    <g id="billete-devuelto"></g>

    <!-- robots -->
    <g id="cliente"></g>
    <g id="cajero"></g>

    <!-- globo de diálogo -->
    <g id="globo">
      <polygon points="334,234 378,234 344,272" fill="#FAF9F5" stroke="#141413" stroke-width="4" stroke-linejoin="round"/>
      <rect x="270" y="134" width="480" height="104" rx="30" fill="#FAF9F5" stroke="#141413" stroke-width="4"/>
      <polygon points="339,228 373,228 346,264" fill="#FAF9F5"/>
      <text x="510" y="187" text-anchor="middle" dominant-baseline="central"
            font-family="Tahoma, Verdana, sans-serif" font-size="56" fill="#141413">Me diste de más.</text>
    </g>
  </g>
</svg>

<div class="controls" role="group" aria-label="Vista">
  <button data-mode="anim" aria-pressed="true">Animación</button>
  <button data-mode="inicio" aria-pressed="false">Cuadro inicial</button>
  <button data-mode="final" aria-pressed="false">Cuadro final</button>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };

  // Góndolas: mismos colores que la versión Python (paleta Anthropic, mezclada 45% con el fondo)
  const PRODUCTS = ["#E3AD97", "#A6C0D8", "#AEB89B", "#D8A3A3", "#E1C4AD", "#DCDAE0"];
  const HEIGHTS = [50, 36, 58, 42, 30];
  const gondolas = document.getElementById("gondolas");
  for (const [gx0, gx1] of [[20, 500], [560, 1060]]) {
    el("rect", { x: gx0, y: 120, width: gx1 - gx0, height: 450, fill: "#DEDBD3" }, gondolas);
    [200, 280, 360, 440].forEach((shelfY, i) => {
      el("rect", { x: gx0, y: shelfY, width: gx1 - gx0, height: 8, fill: "#CDCBC2" }, gondolas);
      let x = gx0 + 12, k = i * 3 + Math.floor(gx0 / 20);
      while (x < gx1 - 34) {
        const h = HEIGHTS[k % 5];
        el("rect", { x, y: shelfY - h, width: 26, height: h, fill: PRODUCTS[k % 6] }, gondolas);
        x += 34; k++;
      }
    });
  }

  const cinta = document.getElementById("cinta");
  for (let bx = 430; bx < 740; bx += 60) el("rect", { x: bx, y: 519, width: 30, height: 6 }, cinta);

  function bill(parent, x, y) {
    el("rect", { x: x - 40, y: y - 11, width: 80, height: 22, fill: "#788C5D", stroke: "#566840", "stroke-width": 3 }, parent);
    el("circle", { cx: x, cy: y, r: 7, fill: "none", stroke: "#566840", "stroke-width": 3 }, parent);
  }
  bill(document.getElementById("billete-quieto"), 470, 507);
  bill(document.getElementById("billete-devuelto"), 490, 501);

  // Robot del reel de Mythos Preview (escala S sobre el diseño base)
  const S = 1.5;
  const R = 62 * S, ARM_LEN = 84 * S, ARM_ANGLE = 30;
  const WHITE = "#F6F7F9", SHADE = "#CDD2DA", LINE = "#969CA8", SCREEN = "#181A24",
        GLOW = "#5CE1F0", GLOW_LIGHT = "#BEF6FC";
  const rad = deg => deg * Math.PI / 180;

  function rotatePoint(x, y, cx, cy, deg) {
    const a = rad(deg), dx = x - cx, dy = y - cy;
    return [cx + dx * Math.cos(a) - dy * Math.sin(a), cy + dx * Math.sin(a) + dy * Math.cos(a)];
  }

  // Brazo-pétalo de largo fijo desde el hombro (jx, jy), apuntando hacia (tx, ty)
  function arm(parent, jx, jy, tx, ty) {
    const dx = tx - jx, dy = ty - jy, len = ARM_LEN, d = Math.hypot(dx, dy);
    const mx = jx + dx / d * len / 2, my = jy + dy / d * len / 2;
    const rot = `rotate(${-Math.atan2(dx, dy) * 180 / Math.PI} ${mx} ${my})`;
    el("ellipse", { cx: mx, cy: my, rx: 15 * S, ry: len / 2, fill: WHITE, stroke: LINE, "stroke-width": 2, transform: rot }, parent);
    el("ellipse", { cx: mx, cy: my + 5, rx: 7 * S, ry: Math.max(4, len / 2 - 12 * S), fill: SHADE, transform: rot }, parent);
  }

  // El cuerpo se inclina `tilt` grados pivotando en la base de la cabeza (cx, cy + R)
  function shoulder(cx, cy, side, tilt) {
    return rotatePoint(cx + side * (R - 6 * S), cy + 14 * S, cx, cy + R, tilt);
  }
  // Punta del brazo con apertura `aperture` (grados desde la vertical del cuerpo)
  function armTip(cx, cy, side, tilt, aperture = ARM_ANGLE) {
    const a = rad(aperture);
    return rotatePoint(cx + side * (R - 6 * S + ARM_LEN * Math.sin(a)), cy + 14 * S + ARM_LEN * Math.cos(a), cx, cy + R, tilt);
  }

  // `tilt` gira el cuerpo; `frontTip` = [x, y] lleva la punta del brazo delantero a ese punto
  function robot(parent, cx, cy, facing, tilt = 0, frontTip = null) {
    parent.replaceChildren();
    const body = el("g", { transform: `rotate(${tilt} ${cx} ${cy + R})` }, parent);

    // propulsor
    el("polygon", { points: `${cx - 20 * S},${cy + R - 6 * S} ${cx + 20 * S},${cy + R - 6 * S} ${cx},${cy + R + 62 * S}`, fill: GLOW }, body);
    el("polygon", { points: `${cx - 9 * S},${cy + R - 6 * S} ${cx + 9 * S},${cy + R - 6 * S} ${cx},${cy + R + 36 * S}`, fill: GLOW_LIGHT }, body);

    // orejas y cabeza
    for (const side of [-1, 1]) {
      const ex = cx + side * (R - 2 * S);
      el("rect", { x: ex - 9 * S, y: cy - 20 * S, width: 18 * S, height: 40 * S, rx: 8 * S, fill: SHADE, stroke: LINE, "stroke-width": 2 }, body);
    }
    el("circle", { cx, cy, r: R, fill: SHADE, stroke: LINE, "stroke-width": 2 }, body);
    el("circle", { cx: cx - 2 * S, cy: cy - 4 * S, r: R - 6 * S, fill: WHITE }, body);

    // pantalla y cara
    const fx = cx + 6 * S * facing;
    el("ellipse", { cx: fx, cy: cy - S, rx: 48 * S, ry: 41 * S, fill: SCREEN }, body);
    for (const ex of [fx - 20 * S, fx + 20 * S]) {
      el("ellipse", { cx: ex, cy: cy - 2 * S, rx: 10 * S, ry: 14 * S, fill: GLOW }, body);
      el("ellipse", { cx: ex - 2 * S, cy: cy - 7 * S, rx: 3 * S, ry: 4 * S, fill: GLOW_LIGHT }, body);
      el("path", { d: `M ${ex - 10.3 * S} ${cy - 26.7 * S} A ${11 * S} ${8 * S} 0 0 1 ${ex + 10.3 * S} ${cy - 26.7 * S}`,
                   fill: "none", stroke: GLOW, "stroke-width": 3 * S, "stroke-linecap": "round" }, body);
    }
    el("path", { d: `M ${fx - 8 * S} ${cy + 20 * S} A ${8 * S} ${8 * S} 0 0 0 ${fx + 8 * S} ${cy + 20 * S} Z`, fill: GLOW }, body);

    // brazos unidos a los costados de la cabeza
    for (const side of [-1, 1]) {
      const [jx, jy] = shoulder(cx, cy, side, tilt);
      const [tx, ty] = side === facing && frontTip ? frontTip : armTip(cx, cy, side, tilt);
      arm(parent, jx, jy, tx, ty);
    }
  }

  // Animación (3.5 s, lineal). El brazo nunca cambia de largo: llega más lejos
  // porque el cuerpo se inclina y el brazo se abre.
  //   0.4 s - 0.9 s  el cliente abre el brazo hasta tocar el borde del billete
  //   0.9 s - 1.9 s  se inclina hacia la caja y empuja el billete en línea recta
  // El globo con el diálogo se ve todo el tiempo.
  const DURATION = 3.5;
  const CLIENTE = [290, 370], CAJERO = [915, 360];
  const BILL_START = 490, TIP_Y = 497;
  const TIP_START = BILL_START - 40, TIP_END = 505;
  const progress = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;

  // Inclinación con la que el brazo (largo fijo) alcanza justo el punto (tx, ty)
  function tiltToReach(tx, ty) {
    let lo = 0, hi = 60;
    for (let i = 0; i < 40; i++) {
      const mid = (lo + hi) / 2, [jx, jy] = shoulder(...CLIENTE, 1, mid);
      if (Math.hypot(tx - jx, ty - jy) > ARM_LEN) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }
  const CONTACT_TILT = tiltToReach(TIP_START, TIP_Y);

  const cliente = document.getElementById("cliente");
  const billete = document.getElementById("billete-devuelto");
  robot(document.getElementById("cajero"), ...CAJERO, -1);

  function render(t) {
    const open = progress(t, 0.4, 0.9), push = progress(t, 0.9, 1.9);
    let tilt, tip;
    if (push === 0) {
      // abrir el brazo: de la pose de reposo a tocar el billete
      tilt = CONTACT_TILT * open;
      const rest = armTip(...CLIENTE, 1, 0);
      tip = [lerp(rest[0], TIP_START, open), lerp(rest[1], TIP_Y, open)];
    } else {
      // empujar: la punta avanza en línea recta y el cuerpo se inclina lo justo para llegar
      tip = [lerp(TIP_START, TIP_END, push), TIP_Y];
      tilt = tiltToReach(...tip);
    }
    robot(cliente, ...CLIENTE, 1, tilt, tip);
    billete.setAttribute("transform", `translate(${Math.max(0, tip[0] - TIP_START)} 0)`);
  }

  // Controles: animación / cuadro inicial / cuadro final
  let mode = "anim", start = performance.now();
  function loop(now) {
    if (mode === "anim") render(((now - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  }
  const buttons = document.querySelectorAll(".controls button");
  buttons.forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    start = performance.now();
    if (mode === "inicio") render(0);
    if (mode === "final") render(DURATION);
    buttons.forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  }));
  const fixed = new URLSearchParams(location.search).get("t");
  if (fixed !== null) { mode = "fijo"; render(Number(fixed)); } else { render(0); requestAnimationFrame(loop); }
</script>
</body>
</html>
