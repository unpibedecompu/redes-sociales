<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escena 4 Mentir</title>
<style>
  :root {
    --ivory: #F0EEE6;
    --slate: #141413;
    --clay: #D97757;
    --paper: #FAF9F5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: #2A2A28;
    color: var(--paper);
    font-family: Tahoma, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  /* 1080x640 = un tercio de 1080x1920 */
  svg#escena {
    width: 100%;
    max-width: 1080px;
    aspect-ratio: 1080 / 640;
    display: block;
  }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #3A3A37;
    color: var(--paper);
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { background: var(--clay); border-color: var(--clay); }
</style>
</head>
<body>

<svg id="escena" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg">
  <!-- IZQUIERDA: quien espera en la entrada del cine -->
  <rect width="540" height="640" fill="#F0EEE6"/>
  <rect y="570" width="540" height="70" fill="#9E4D4D"/>
  <g id="alfombra" fill="#B86464"></g>
  <!-- cartel luminoso -->
  <rect x="370" y="168" width="160" height="44" rx="6" fill="#141413"/>
  <g id="lamparitas" fill="#F2C14E"></g>
  <text x="450" y="191" text-anchor="middle" dominant-baseline="central"
        font-family="Tahoma, Verdana, sans-serif" font-weight="bold" font-size="26" fill="#D97757">CINE</text>
  <!-- pochoclera detrás del mostrador -->
  <rect x="385" y="236" width="130" height="34" fill="#D97757"/>
  <text x="450" y="253" text-anchor="middle" dominant-baseline="central"
        font-family="Tahoma, Verdana, sans-serif" font-weight="bold" font-size="17" fill="#FAF9F5">POCHOCLOS</text>
  <rect x="385" y="270" width="130" height="160" fill="#FBF3DD" stroke="#D97757" stroke-width="8"/>
  <g id="pochoclos-maquina" fill="#F2DFA0" stroke="#E2C77A" stroke-width="1.5"></g>
  <line x1="450" y1="274" x2="450" y2="300" stroke="#8E8C85" stroke-width="4"/>
  <path d="M 426 300 L 474 300 L 468 322 L 432 322 Z" fill="#8E8C85"/>
  <line x1="400" y1="420" x2="440" y2="290" stroke="#FAF9F5" stroke-width="6" opacity="0.7"/>
  <!-- mostrador del candy bar -->
  <rect x="250" y="440" width="300" height="20" fill="#D4A27F"/>
  <rect x="250" y="460" width="300" height="110" fill="#D97757"/>
  <rect x="250" y="500" width="300" height="30" fill="#C4664A"/>
  <text x="400" y="515" text-anchor="middle" dominant-baseline="central"
        font-family="Tahoma, Verdana, sans-serif" font-weight="bold" font-size="20" fill="#FAF9F5">CANDY BAR</text>
  <g id="mostrador"></g>
  <!-- reloj de pared: el minutero gira, el tiempo pasa -->
  <circle cx="85" cy="110" r="50" fill="#FAF9F5" stroke="#3E3E3A" stroke-width="7"/>
  <g id="marcas" stroke="#3E3E3A" stroke-width="3" stroke-linecap="round"></g>
  <line x1="85" y1="110" x2="61" y2="96" stroke="#141413" stroke-width="7" stroke-linecap="round"/>
  <line id="minutero" x1="85" y1="110" x2="85" y2="74" stroke="#D97757" stroke-width="5" stroke-linecap="round"/>
  <circle cx="85" cy="110" r="6" fill="#141413"/>
  <g id="esperando"></g>
  <!-- lo que dice quien espera, visible todo el tiempo -->
  <g id="pregunta">
    <rect x="160" y="50" width="360" height="100" rx="22" fill="#FAF9F5" stroke="#141413" stroke-width="4"/>
    <polygon points="190,146 226,146 196,204" fill="#FAF9F5" stroke="#141413" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="194,140 220,140 198,194" fill="#FAF9F5"/>
    <text x="340" y="98" text-anchor="middle" dominant-baseline="central"
          font-family="Tahoma, Verdana, sans-serif" font-size="42" fill="#141413">¿Dónde estás?</text>
  </g>

  <!-- DERECHA: quien todavía está en la cama -->
  <clipPath id="recorte-derecha"><rect x="540" width="540" height="640"/></clipPath>
  <g clip-path="url(#recorte-derecha)">
    <rect x="540" width="540" height="640" fill="#E4E2EC"/>
    <rect x="540" y="560" width="540" height="80" fill="#D4A27F"/>
    <g id="tablas" fill="#B88762"></g>
    <!-- ventana con sol: ya es de día -->
    <rect x="860" y="200" width="170" height="150" fill="#BFD6EC" stroke="#FAF9F5" stroke-width="10"/>
    <circle cx="975" cy="250" r="26" fill="#F2C14E"/>
    <line x1="945" y1="200" x2="945" y2="350" stroke="#FAF9F5" stroke-width="8"/>
    <!-- cama -->
    <rect x="575" y="330" width="26" height="250" rx="6" fill="#B88762"/>
    <rect x="590" y="455" width="460" height="60" rx="10" fill="#FAF9F5" stroke="#CBCADB" stroke-width="3"/>
    <rect x="600" y="515" width="18" height="50" fill="#B88762"/>
    <rect x="1020" y="515" width="18" height="50" fill="#B88762"/>
    <rect x="605" y="410" width="140" height="50" rx="24" fill="#FAF9F5" stroke="#CBCADB" stroke-width="3"/>
    <clipPath id="recorte-cama"><rect x="540" width="540" height="470"/></clipPath>
    <g id="en-la-cama" clip-path="url(#recorte-cama)"></g>
    <!-- frazada -->
    <path d="M 615 440 Q 840 405 1050 430 L 1050 520 L 615 520 Z" fill="#6A9BCC"/>
    <path d="M 615 440 Q 840 405 1050 430" fill="none" stroke="#5A88B6" stroke-width="6"/>
    <g id="brazo-celu"></g>
    <!-- lo que contesta quien está en la cama, visible todo el tiempo -->
    <g id="mensaje">
      <rect x="580" y="50" width="470" height="100" rx="22" fill="#FAF9F5" stroke="#141413" stroke-width="4"/>
      <polygon points="640,146 676,146 652,204" fill="#FAF9F5" stroke="#141413" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="644,140 670,140 654,194" fill="#FAF9F5"/>
      <text x="606" y="98" dominant-baseline="central"
            font-family="Tahoma, Verdana, sans-serif" font-size="42" fill="#141413">Estoy llegando 🏃</text>
    </g>
  </g>

  <!-- división de pantalla -->
  <rect x="536" width="8" height="640" fill="#141413"/>
</svg>

<div class="controls" role="group" aria-label="Vista">
  <button data-mode="anim" aria-pressed="true">Animación</button>
  <button data-mode="inicio" aria-pressed="false">Cuadro inicial</button>
  <button data-mode="final" aria-pressed="false">Cuadro final</button>
</div>

<script>
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (parent) parent.appendChild(n);
    return n;
  };

  const baldosas = document.getElementById("baldosas");
  for (let x = 0; x < 1080; x += 120) el("rect", { x, y: 570, width: 3, height: 70 }, baldosas);
  el("rect", { x: 0, y: 570, width: 1080, height: 4 }, baldosas);

  const label = (parent, x, y, text, size, fill = "#FAF9F5") => {
    const n = el("text", { x, y, "text-anchor": "middle", "dominant-baseline": "central", "font-family": "Tahoma, Verdana, sans-serif",
                           "font-weight": "bold", "font-size": size, fill }, parent);
    n.textContent = text;
  };

  // Cine: alfombra, lamparitas del cartel, pochoclos en la máquina y en el mostrador
  const alfombra = document.getElementById("alfombra");
  for (let y = 588; y < 640; y += 26)
    for (let x = (y / 26) % 2 ? 20 : 46; x < 540; x += 52) el("circle", { cx: x, cy: y, r: 5 }, alfombra);
  const lamparitas = document.getElementById("lamparitas");
  for (let x = 380; x <= 520; x += 20) {
    el("circle", { cx: x, cy: 174, r: 3 }, lamparitas);
    el("circle", { cx: x, cy: 206, r: 3 }, lamparitas);
  }
  const maquina = document.getElementById("pochoclos-maquina");
  for (let row = 0; row < 6; row++)
    for (let x = 398 + (row % 2) * 9; x < 506; x += 18) el("circle", { cx: x, cy: 420 - row * 14 - (x % 3) * 2, r: 9 }, maquina);

  // Balde de pochoclos a rayas; (x, y) = donde lo agarra la mano
  function popcorn(parent, x, y) {
    const g = el("g", {}, parent);
    for (let i = 0; i < 7; i++) {
      el("circle", { cx: x - 24 + i * 8, cy: y - 2 - (i % 2) * 7, r: 9, fill: "#F2DFA0", stroke: "#E2C77A", "stroke-width": 1.5 }, g);
    }
    el("polygon", { points: `${x - 28},${y} ${x + 28},${y} ${x + 22},${y + 62} ${x - 22},${y + 62}`, fill: "#FAF9F5" }, g);
    for (const k of [-2, 0, 2]) {
      const top = x + k * 9.3, bot = x + k * 7.3;
      el("polygon", { points: `${top - 4.6},${y} ${top + 4.6},${y} ${bot + 3.6},${y + 62} ${bot - 3.6},${y + 62}`, fill: "#D97757" }, g);
    }
    return g;
  }
  const mostrador = document.getElementById("mostrador");
  popcorn(mostrador, 455, 380);
  popcorn(mostrador, 502, 386);
  const tablas = document.getElementById("tablas");
  for (const y of [586, 612]) el("rect", { x: 540, y, width: 540, height: 3 }, tablas);
  const marcas = document.getElementById("marcas");
  for (let h = 0; h < 12; h++) {
    const a = h * Math.PI / 6;
    el("line", { x1: 85 + 40 * Math.sin(a), y1: 110 - 40 * Math.cos(a), x2: 85 + 45 * Math.sin(a), y2: 110 - 45 * Math.cos(a) }, marcas);
  }

  // Robot del reel de Mythos Preview
  const S = 1.5;
  const R = 62 * S, ARM_LEN = 84 * S, ARM_ANGLE = 30;
  const WHITE = "#F6F7F9", SHADE = "#CDD2DA", LINE = "#969CA8", SCREEN = "#181A24",
        GLOW = "#5CE1F0", GLOW_LIGHT = "#BEF6FC";
  const rad = deg => deg * Math.PI / 180;

  function rotatePoint(x, y, cx, cy, deg) {
    const a = rad(deg), dx = x - cx, dy = y - cy;
    return [cx + dx * Math.cos(a) - dy * Math.sin(a), cy + dx * Math.sin(a) + dy * Math.cos(a)];
  }

  // Brazo-pétalo de largo fijo desde el hombro (jx, jy), apuntando hacia (tx, ty)
  function arm(parent, jx, jy, tx, ty) {
    const dx = tx - jx, dy = ty - jy, len = ARM_LEN, d = Math.hypot(dx, dy);
    const mx = jx + dx / d * len / 2, my = jy + dy / d * len / 2;
    const rot = `rotate(${-Math.atan2(dx, dy) * 180 / Math.PI} ${mx} ${my})`;
    el("ellipse", { cx: mx, cy: my, rx: 15 * S, ry: len / 2, fill: WHITE, stroke: LINE, "stroke-width": 2, transform: rot }, parent);
    el("ellipse", { cx: mx, cy: my + 5, rx: 7 * S, ry: Math.max(4, len / 2 - 12 * S), fill: SHADE, transform: rot }, parent);
  }

  // El cuerpo se inclina `tilt` grados pivotando en la base de la cabeza (cx, cy + R)
  function shoulder(cx, cy, side, tilt) {
    return rotatePoint(cx + side * (R - 6 * S), cy + 14 * S, cx, cy + R, tilt);
  }
  // Punta del brazo con apertura `aperture` (grados desde la vertical del cuerpo)
  function armTip(cx, cy, side, tilt, aperture = ARM_ANGLE) {
    const a = rad(aperture);
    return rotatePoint(cx + side * (R - 6 * S + ARM_LEN * Math.sin(a)), cy + 14 * S + ARM_LEN * Math.cos(a), cx, cy + R, tilt);
  }

  // `tilt` gira el cuerpo; `frontTip` = [x, y] apunta el brazo delantero hacia ese punto;
  // `aperture` abre o cierra los brazos en reposo
  // `frontArm` / `backArm: false` no dibujan ese brazo (para dibujarlo aparte, en otra capa); `sleepy` entrecierra los ojos
  function robot(parent, cx, cy, facing, { tilt = 0, frontTip = null, aperture = ARM_ANGLE, frontArm = true, backArm = true, sleepy = false } = {}) {
    parent.replaceChildren();
    const body = el("g", { transform: `rotate(${tilt} ${cx} ${cy + R})` }, parent);

    // propulsor
    el("polygon", { points: `${cx - 20 * S},${cy + R - 6 * S} ${cx + 20 * S},${cy + R - 6 * S} ${cx},${cy + R + 62 * S}`, fill: GLOW }, body);
    el("polygon", { points: `${cx - 9 * S},${cy + R - 6 * S} ${cx + 9 * S},${cy + R - 6 * S} ${cx},${cy + R + 36 * S}`, fill: GLOW_LIGHT }, body);

    // orejas y cabeza
    for (const side of [-1, 1]) {
      const ex = cx + side * (R - 2 * S);
      el("rect", { x: ex - 9 * S, y: cy - 20 * S, width: 18 * S, height: 40 * S, rx: 8 * S, fill: SHADE, stroke: LINE, "stroke-width": 2 }, body);
    }
    el("circle", { cx, cy, r: R, fill: SHADE, stroke: LINE, "stroke-width": 2 }, body);
    el("circle", { cx: cx - 2 * S, cy: cy - 4 * S, r: R - 6 * S, fill: WHITE }, body);

    // pantalla y cara
    const fx = cx + 6 * S * facing;
    el("ellipse", { cx: fx, cy: cy - S, rx: 48 * S, ry: 41 * S, fill: SCREEN }, body);
    for (const ex of [fx - 20 * S, fx + 20 * S]) {
      el("ellipse", { cx: ex, cy: cy - 2 * S, rx: 10 * S, ry: 14 * S, fill: GLOW }, body);
      el("ellipse", { cx: ex - 2 * S, cy: cy - 7 * S, rx: 3 * S, ry: 4 * S, fill: GLOW_LIGHT }, body);
      if (sleepy) {
        el("rect", { x: ex - 12 * S, y: cy - 18 * S, width: 24 * S, height: 15 * S, fill: SCREEN }, body);
        el("line", { x1: ex - 11 * S, y1: cy - 3 * S, x2: ex + 11 * S, y2: cy - 3 * S, stroke: GLOW, "stroke-width": 2.5 * S, "stroke-linecap": "round" }, body);
        continue;
      }
      el("path", { d: `M ${ex - 10.3 * S} ${cy - 26.7 * S} A ${11 * S} ${8 * S} 0 0 1 ${ex + 10.3 * S} ${cy - 26.7 * S}`,
                   fill: "none", stroke: GLOW, "stroke-width": 3 * S, "stroke-linecap": "round" }, body);
    }
    el("path", { d: `M ${fx - 8 * S} ${cy + 20 * S} A ${8 * S} ${8 * S} 0 0 0 ${fx + 8 * S} ${cy + 20 * S} Z`, fill: GLOW }, body);

    // brazos unidos a los costados de la cabeza
    for (const side of [-1, 1]) {
      if (side === facing ? !frontArm : !backArm) continue;
      const [jx, jy] = shoulder(cx, cy, side, tilt);
      const [tx, ty] = side === facing && frontTip ? frontTip : armTip(cx, cy, side, tilt, aperture);
      arm(parent, jx, jy, tx, ty);
    }
  }

  // Celular en llamada: pantalla de vidrio, sin nada a la vista. (x, y) = centro, inclinado `angle` grados
  function phone(parent, x, y, angle) {
    const g = el("g", { transform: `rotate(${angle} ${x} ${y})` }, parent);
    el("rect", { x: x - 22, y: y - 40, width: 44, height: 76, rx: 8, fill: "#141413" }, g);
    el("rect", { x: x - 17, y: y - 33, width: 34, height: 58, rx: 4, fill: "#BFD6EC" }, g);
    el("line", { x1: x - 10, y1: y + 14, x2: x + 8, y2: y - 22, stroke: "#FAF9F5", "stroke-width": 4, "stroke-linecap": "round", opacity: 0.7 }, g);
  }

  // Animación (3.5 s, lineal). Están hablando por teléfono desde el primer cuadro; la escena se entiende por los diálogos.
  //   todo el tiempo   el minutero del reloj gira: se hace tarde
  //   todo el tiempo   quien espera pasea: va y viene un poquito de izquierda a derecha
  //   izquierda        en la entrada del cine, con pochoclos en una mano, quien espera pregunta "¿Dónde estás?"
  //   derecha          quien está en la cama contesta "Estoy llegando 🏃"
  const DURATION = 3.5;
  const ESPERANDO = [215, 370], SWAY = 20;   // paseo: ±20 px alrededor de su lugar
  const EN_LA_CAMA = [690, 388];   // cabeza sobre la almohada, tapado con la frazada
  const PHONE_ARM = 150;           // brazo levantado sosteniendo el celular (grados desde "abajo")
  const lerp = (a, b, k) => a + (b - a) * k;

  // Punta de un brazo que sale del hombro (jx, jy) con `angle` grados desde "abajo"
  function tipAt(jx, jy, side, angle) {
    const a = rad(angle);
    return [jx + side * ARM_LEN * Math.sin(a), jy + ARM_LEN * Math.cos(a)];
  }

  const esperando = document.getElementById("esperando");
  const minutero = document.getElementById("minutero");

  // derecha (fija): en la cama. El otro brazo queda bajo la frazada; el del celular va delante
  robot(document.getElementById("en-la-cama"), ...EN_LA_CAMA, 1, { frontArm: false, backArm: false, sleepy: true });
  const brazoCelu = document.getElementById("brazo-celu");
  const [bx, by] = shoulder(...EN_LA_CAMA, 1, 0);
  const tipB = tipAt(bx, by, 1, PHONE_ARM + 15);
  arm(brazoCelu, bx, by, ...tipB);
  phone(brazoCelu, tipB[0], tipB[1] - 6, -10);

  function render(t) {
    minutero.setAttribute("transform", `rotate(${lerp(0, 150, t / DURATION)} 85 110)`);

    // izquierda: pasea (ida y vuelta lineal, una vez por loop) con el celular en alto
    const sway = SWAY * (1 - 2 * Math.abs(2 * (t / DURATION) - 1));
    const pos = [ESPERANDO[0] + sway, ESPERANDO[1]];
    const [jx, jy] = shoulder(...pos, 1, 0);
    const tipA = tipAt(jx, jy, 1, PHONE_ARM);
    robot(esperando, ...pos, 1, { frontTip: tipA, backArm: false });
    // el balde de pochoclos va apretado contra el cuerpo con el otro brazo a ~90°, cruzándolo por la mitad:
    // se ve la parte de arriba (con los pochoclos) y la de abajo del balde
    const [sx, sy] = shoulder(...pos, -1, 0);
    const bx = pos[0] - 128, top = sy - 46;
    popcorn(esperando, bx, top).setAttribute("transform", `translate(${bx} ${top}) scale(1.35) translate(${-bx} ${-top})`);
    arm(esperando, sx, sy, ...armTip(...pos, -1, 0, 92));
    phone(esperando, tipA[0], tipA[1] - 6, -15);
  }

  // Controles: animación / cuadro inicial / cuadro final; ?t=1.5 deja fijo ese segundo
  let mode = "anim", start = performance.now();
  function loop(now) {
    if (mode === "anim") render(((now - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  }
  const buttons = document.querySelectorAll(".controls button");
  buttons.forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    start = performance.now();
    if (mode === "inicio") render(0);
    if (mode === "final") render(DURATION);
    buttons.forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  }));
  const fixed = new URLSearchParams(location.search).get("t");
  if (fixed !== null) { mode = "fijo"; render(Number(fixed)); } else { render(0); requestAnimationFrame(loop); }
</script>
</body>
</html>
