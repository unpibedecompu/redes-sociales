<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geoffrey Hinton — Próceres de la IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&amp;display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: #111;
  color: #eee;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  gap: 28px;
}

header {
  width: min(540px, 90vw);
}
.pilar-label {
  font-size: 0.7rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #9b5de5;
  margin-bottom: 8px;
}
header h2 {
  font-size: 1.5rem;
  font-weight: 700;
  color: #eee;
  margin-bottom: 5px;
}
header p {
  font-size: 0.78rem;
  color: #555;
}

/* ── Carousel ── */
.ig-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  width: min(540px, 90vw);
}

.ig-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.ig-frame {
  flex: 1;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  border-radius: 14px;
  position: relative;
}

.ig-track {
  display: flex;
  height: 100%;
  transition: transform 0.38s cubic-bezier(.4, 0, .2, 1);
}

.ig-item {
  height: 100%;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}

.sl-scale {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: top left;
}

.sl {
  width: 1080px;
  height: 1080px;
  border-radius: 32px;
  overflow: hidden;
  position: relative;
  font-family: 'Outfit', sans-serif;
}

/* ── Arrows ── */
.arrow {
  background: none;
  border: 1px solid #2a2a2a;
  color: #555;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  flex-shrink: 0;
  transition: border-color .2s, color .2s;
  user-select: none;
}
.arrow:hover:not(:disabled) { border-color: #9b5de5; color: #9b5de5; }
.arrow:disabled { opacity: 0.2; cursor: default; }

/* ── Dots ── */
.ig-dots {
  display: flex;
  gap: 7px;
  align-items: center;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #2e2e2e;
  cursor: pointer;
  transition: background .22s, transform .22s;
}
.dot.active {
  background: #9b5de5;
  transform: scale(1.25);
}

/* ── Edit mode ── */
.edit-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.edit-toggle {
  background: none;
  border: 1px solid #2a2a2a;
  color: #555;
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  font-size: 0.75rem;
  letter-spacing: .05em;
  flex-shrink: 0;
  transition: border-color .2s, color .2s;
}
.edit-toggle:hover, .edit-toggle.active { border-color: #9b5de5; color: #9b5de5; }
.coord-panel {
  display: none;
  align-items: center;
  gap: 8px;
  flex: 1;
  overflow: hidden;
}
.coord-text {
  font-size: 0.68rem;
  color: #555;
  font-family: monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.coord-copy {
  background: none;
  border: 1px solid #2a2a2a;
  color: #555;
  padding: 4px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 0.68rem;
  font-family: 'Outfit', sans-serif;
  flex-shrink: 0;
  transition: border-color .2s, color .2s;
}
.coord-copy:hover { border-color: #9b5de5; color: #9b5de5; }
.coord-download { border-color: #1e3a1e; color: #3a7a3a; }
.coord-download:hover { border-color: #4caf50; color: #4caf50; }
body.edit-mode .sl { cursor: grab !important; }
body.edit-mode .sl * { cursor: grab !important; }
body.edit-mode.dragging .sl,
body.edit-mode.dragging .sl * { cursor: grabbing !important; }
</style>
</head>
<body>

<header>
  <div class="pilar-label">Pilar 2 · Profesionales de la IA</div>
  <h2>Geoffrey Hinton</h2>
  <p>Próceres de la IA · 7 slides · 1080×1080 px</p>
</header>

<div class="ig-wrap">
  <div class="ig-row">
    <button class="arrow" id="prev" disabled>←</button>
    <div class="ig-frame" id="frame">
      <div class="ig-track" id="track"></div>
    </div>
    <button class="arrow" id="next">→</button>
  </div>
  <div class="ig-dots" id="dots"></div>
  <div class="edit-bar">
    <button class="edit-toggle" id="editBtn">Edit background</button>
    <div class="coord-panel" id="coordPanel" style="display:none">
      <span class="coord-text" id="coordText">top:-49px; left:-719px</span>
      <button class="coord-copy" id="copyBtn">Copy</button>
      <button class="coord-copy" id="saveBtn">Saved ✓</button>
      <button class="coord-copy coord-download" id="downloadBtn">↓ HTML</button>
    </div>
  </div>
</div>

<script>
const C = { bg1:'#f0e8ff', bg2:'#e4d4ff', acc:'#9b5de5', txt:'#1a1a1a', wht:'#ffffff' };

const slides = [

  /* 01 · Portada */
  `<div class="sl" style="background:${C.acc};padding:54px">
    <img src="background/profile_picture.webp" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0.3;mix-blend-mode:luminosity;border-radius:32px;z-index:0">
    <img src="background/profile_picture.webp" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top;clip-path:inset(360px 400px 620px 350px);z-index:0">
    <div style="border:8px solid rgba(255,255,255,.4);height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:space-between;padding:86px;position:relative;z-index:1">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.7)">Próceres de la IA</div>
        <div style="font-size:5.94rem;font-weight:900;color:${C.wht};line-height:1.1">Geoffrey Hinton</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:43px">
        <div style="font-size:3.35rem;color:rgba(255,255,255,.8);line-height:1.4">El científico que construyó la IA moderna — y ahora dice que puede destruir a la humanidad.</div>
        <div style="display:flex;gap:16px;flex-wrap:nowrap">
          <span style="font-size:1.6rem;padding:10px 22px;border:4px solid rgba(255,255,255,.4);border-radius:108px;color:rgba(255,255,255,.8);white-space:nowrap">Premio Turing 2018</span>
          <span style="font-size:1.6rem;padding:10px 22px;border:4px solid rgba(255,255,255,.4);border-radius:108px;color:rgba(255,255,255,.8);white-space:nowrap">Nobel de Física 2024</span>
          <span style="font-size:1.6rem;padding:10px 22px;border:4px solid rgba(255,255,255,.4);border-radius:108px;color:rgba(255,255,255,.8);white-space:nowrap">Ex-Google Brain</span>
        </div>
      </div>
    </div>
  </div>`,

  /* 02 · Trayectoria */
  `<div class="sl" style="background:${C.bg1};padding:54px">
    <img src="background/profile_picture.webp" style="position:absolute;width:2600px;height:auto;top:-700px;left:-1000px;opacity:0.25;mix-blend-mode:multiply;filter:grayscale(1) blur(8px);z-index:0">
    <div style="border:8px solid ${C.acc};height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:86px;gap:48px;position:relative;z-index:1">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">Trayectoria</div>
      <div style="position:relative;display:flex;flex-direction:column">
        <div style="position:absolute;left:17px;top:22px;bottom:22px;width:6px;background:${C.acc};border-radius:3px"></div>
        <div style="display:flex;gap:48px;align-items:flex-start;padding-bottom:62px">
          <div style="width:40px;height:40px;border-radius:50%;background:${C.acc};flex-shrink:0;margin-top:2px;position:relative;z-index:1"></div>
          <div>
            <div style="font-size:2.8rem;font-weight:700;color:${C.acc};line-height:1">1986</div>
            <div style="font-size:2.6rem;color:${C.txt};line-height:1.45;margin-top:14px">Publicó el descubrimiento que hace posible que las máquinas aprendan. Sin él, no existiría ninguna IA actual.</div>
          </div>
        </div>
        <div style="display:flex;gap:48px;align-items:flex-start;padding-bottom:62px">
          <div style="width:40px;height:40px;border-radius:50%;background:${C.acc};flex-shrink:0;margin-top:2px;position:relative;z-index:1"></div>
          <div>
            <div style="font-size:2.8rem;font-weight:700;color:${C.acc};line-height:1">2012</div>
            <div style="font-size:2.6rem;color:${C.txt};line-height:1.45;margin-top:14px">Su equipo demostró que las máquinas podían simular inteligencia, dando inicio a la revolución del deep learning.</div>
          </div>
        </div>
        <div style="display:flex;gap:48px;align-items:flex-start">
          <div style="width:40px;height:40px;border-radius:50%;background:${C.acc};flex-shrink:0;margin-top:2px;position:relative;z-index:1"></div>
          <div>
            <div style="font-size:2.8rem;font-weight:700;color:${C.acc};line-height:1">2018</div>
            <div style="font-size:2.6rem;color:${C.txt};line-height:1.45;margin-top:14px">Recibió el Premio Turing — el "Nobel de la Computación".</div>
          </div>
        </div>
      </div>
    </div>
  </div>`,

  /* 05 · El giro */
  `<div class="sl" style="background:${C.bg1};padding:54px">
    <img src="background/profile_picture.webp" style="position:absolute;width:2600px;height:auto;top:-1100px;left:-760px;opacity:0.25;mix-blend-mode:multiply;filter:grayscale(1) blur(8px);z-index:0">
    <div style="border:8px solid ${C.acc};height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:86px;gap:54px;position:relative;z-index:1">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">El giro</div>
      <div style="font-size:3.9rem;font-weight:700;color:${C.txt};line-height:1.3">En 2022, una IA hizo algo que él pensaba que tardaría décadas en pasar, y en meses cambió de opinión sobre todo lo que había construido.</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
    </div>
  </div>`,

  /* 06 · Trayectoria 2024 */
  `<div class="sl" style="background:${C.bg1};padding:54px">
    <img src="background/profile_picture.webp" style="position:absolute;width:2600px;height:auto;top:-700px;left:-500px;opacity:0.25;mix-blend-mode:multiply;filter:grayscale(1) blur(8px);z-index:0">
    <div style="border:8px solid ${C.acc};height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:86px;gap:54px;position:relative;z-index:1">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">Trayectoria</div>
      <div style="font-size:2.8rem;font-weight:700;color:${C.acc}">2024</div>
      <div style="font-size:3.0rem;color:${C.txt};line-height:1.5">En 2024, ganó el Premio Nobel de Física — y usó el discurso para advertirle al mundo sobre los peligros de la IA.</div>
    </div>
  </div>`,

  /* 07 · Cita */
  `<div class="sl" style="background:${C.bg2};padding:54px">
    <div style="border:8px solid ${C.acc};height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:86px;gap:54px;position:relative;z-index:1">
      <div style="font-size:9.7rem;font-weight:900;color:${C.acc};opacity:.2;line-height:1">"</div>
      <div style="font-size:3.35rem;font-weight:600;color:${C.txt};line-height:1.6;font-style:italic">Hay una amenaza existencial de más largo plazo que surgirá cuando creemos seres digitales más inteligentes que nosotros. No tenemos idea de si podemos mantenernos en control.</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:2.7rem;letter-spacing:.1em;text-transform:uppercase;color:${C.acc}">Geoffrey Hinton · Discurso del Nobel, diciembre 2024</div>
    </div>
  </div>`,

  /* 08 · Para pensar */
  `<div class="sl" style="background:${C.bg1};padding:54px">
    <img src="background/profile_picture.webp" style="position:absolute;width:2600px;height:auto;top:-49px;left:-719px;opacity:0.25;mix-blend-mode:multiply;filter:grayscale(1) blur(8px);z-index:0">
    <div style="border:8px solid ${C.acc};height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:center;padding:86px;gap:54px;position:relative;z-index:1">
      <div style="font-size:2.6rem;letter-spacing:.15em;text-transform:uppercase;color:${C.acc}">Para pensar</div>
      <div style="font-size:4.2rem;font-weight:700;color:${C.txt};line-height:1.3">¿Es responsable seguir construyendo algo que sus propios creadores admiten que no pueden controlar?</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
    </div>
  </div>`,

  /* 09 · Qué sigue */
  `<div class="sl" style="background:${C.bg1};padding:54px">
    <div style="border:8px solid ${C.acc};height:100%;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:86px;gap:43px">
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:${C.acc}">Próximo perfil</div>
      <div style="font-size:4.86rem;font-weight:700;color:${C.txt};text-align:center;line-height:1.3">¿Quién sigue?</div>
      <div style="width:130px;height:8px;background:${C.acc}"></div>
      <div style="font-size:3.1rem;color:${C.txt};opacity:.65;text-align:center;line-height:1.5;max-width:702px">Seguinos para conocer a las personas detrás del debate más importante del siglo.</div>
      <div style="font-size:2.6rem;letter-spacing:.18em;text-transform:uppercase;color:${C.acc};margin-top:22px">@unpibedecompu</div>
    </div>
  </div>`

];

const frame   = document.getElementById('frame');
const track   = document.getElementById('track');
const dotsEl  = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');

let current = 0;
const total = slides.length;
const slideWidthPct = 100 / total;

// Build slides
slides.forEach(html => {
  const item = document.createElement('div');
  item.className = 'ig-item';
  item.style.cssText = `width:${slideWidthPct}%`;
  const scaler = document.createElement('div');
  scaler.className = 'sl-scale';
  scaler.innerHTML = html;
  item.appendChild(scaler);
  track.appendChild(item);
});

track.style.width = `${total * 100}%`;

// Build dots
for (let i = 0; i < total; i++) {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
}

function applyScale() {
  const fw = frame.offsetWidth;
  const scale = fw / 1080;
  document.querySelectorAll('.sl-scale').forEach(el => {
    el.style.transform = `scale(${scale})`;
  });
}

function goTo(index) {
  current = Math.max(0, Math.min(index, total - 1));
  track.style.transform = `translateX(-${current * slideWidthPct}%)`;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === total - 1;
  if (editMode) showCurrentBgCoord();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo(current - 1);
  if (e.key === 'ArrowRight') goTo(current + 1);
});

// drag editor state — declared before goTo(0) to avoid TDZ
let editMode = false;
let isDragging = false;
let dragImg = null;
let dragStartX = 0, dragStartY = 0;
let dragOrigTop = 0, dragOrigLeft = 0;
let dragOrigObjX = 0, dragOrigObjY = 0;
let dragIsObjectFit = false;

applyScale();
window.addEventListener('resize', applyScale);
goTo(0);

// ── Background drag editor ──
const editBtn    = document.getElementById('editBtn');
const coordPanel = document.getElementById('coordPanel');
const coordText  = document.getElementById('coordText');
const copyBtn    = document.getElementById('copyBtn');
const saveBtn    = document.getElementById('saveBtn');
const downloadBtn = document.getElementById('downloadBtn');

function parseObjPos(style) {
  const raw = (style.objectPosition || '50% 50%').trim();
  const kwX = { left: 0, center: 50, right: 100 };
  const kwY = { top: 0, center: 50, bottom: 100 };
  const parts = raw.split(/\s+/);
  if (parts.length === 1) {
    const k = parts[0].toLowerCase();
    if (k === 'top')    return { x: 50, y: 0 };
    if (k === 'bottom') return { x: 50, y: 100 };
    if (k === 'left')   return { x: 0,  y: 50 };
    if (k === 'right')  return { x: 100, y: 50 };
    if (k === 'center') return { x: 50, y: 50 };
    const v = parseFloat(k);
    return { x: v, y: v };
  }
  const parseVal = (v, axis) => {
    const k = v.toLowerCase();
    const kw = axis === 'x' ? kwX : kwY;
    return kw[k] !== undefined ? kw[k] : parseFloat(k);
  };
  return { x: parseVal(parts[0], 'x'), y: parseVal(parts[1], 'y') };
}

function showCurrentBgCoord() {
  const slEls = document.querySelectorAll('.sl');
  const sl = slEls[current];
  const img = sl ? sl.querySelector('img') : null;
  if (!img) { coordText.textContent = '(no background)'; return; }
  if (img.style.objectFit) {
    coordText.textContent = `object-position: ${img.style.objectPosition || 'top'}`;
  } else {
    const t = Math.round(parseFloat(img.style.top)  || 0);
    const l = Math.round(parseFloat(img.style.left) || 0);
    coordText.textContent = `top:${t}px; left:${l}px`;
  }
}

editBtn.addEventListener('click', () => {
  editMode = !editMode;
  editBtn.classList.toggle('active', editMode);
  document.body.classList.toggle('edit-mode', editMode);
  coordPanel.style.display = editMode ? 'flex' : 'none';
  if (editMode) showCurrentBgCoord();
});

document.addEventListener('mousedown', e => {
  if (!editMode) return;
  const sl = e.target.closest('.sl');
  if (!sl) return;
  const img = sl.querySelector('img');
  if (!img) return;

  e.preventDefault();
  isDragging = true;
  dragImg = img;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragIsObjectFit = !!img.style.objectFit;
  document.body.classList.add('dragging');

  if (dragIsObjectFit) {
    const op = parseObjPos(img.style);
    dragOrigObjX = op.x;
    dragOrigObjY = op.y;
  } else {
    dragOrigTop  = parseFloat(img.style.top)  || 0;
    dragOrigLeft = parseFloat(img.style.left) || 0;
  }
});

document.addEventListener('mousemove', e => {
  if (!isDragging || !dragImg) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;

  if (dragIsObjectFit) {
    const fw = frame.offsetWidth;
    const fh = frame.offsetHeight;
    const newX = Math.max(0, Math.min(100, dragOrigObjX + (dx / fw) * 100));
    const newY = Math.max(0, Math.min(100, dragOrigObjY + (dy / fh) * 100));
    dragImg.style.objectPosition = `${newX.toFixed(1)}% ${newY.toFixed(1)}%`;
    coordText.textContent = `object-position: ${dragImg.style.objectPosition}`;
  } else {
    const scale = frame.offsetWidth / 1080;
    dragImg.style.top  = `${dragOrigTop  + dy / scale}px`;
    dragImg.style.left = `${dragOrigLeft + dx / scale}px`;
    const t = Math.round(parseFloat(dragImg.style.top));
    const l = Math.round(parseFloat(dragImg.style.left));
    coordText.textContent = `top:${t}px; left:${l}px`;
  }
});

document.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  dragImg = null;
  document.body.classList.remove('dragging');
});

copyBtn.addEventListener('click', () => {
  const text = coordText.textContent;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
  }).catch(() => {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
  });
});

saveBtn.addEventListener('click', () => {
  const slEls = document.querySelectorAll('.sl');
  const sl = slEls[current];
  const img = sl ? sl.querySelector('img') : null;
  if (!img) {
    saveBtn.textContent = 'No BG';
    setTimeout(() => { saveBtn.textContent = 'Save'; }, 1200);
    return;
  }

  const scriptEl = document.querySelector('script');
  const isOF = !!img.style.objectFit;

  if (isOF) {
    const newVal = img.style.objectPosition;
    const oldMatch = slides[current].match(/object-position:([^;'">\s]+)/);
    if (oldMatch) {
      const oldVal = oldMatch[1];
      if (oldVal !== newVal) {
        const from = `object-position:${oldVal}`;
        const to   = `object-position:${newVal}`;
        slides[current]         = slides[current].replace(from, to);
        scriptEl.textContent    = scriptEl.textContent.replace(from, to);
      }
    }
  } else {
    const newTop  = Math.round(parseFloat(img.style.top))  + 'px';
    const newLeft = Math.round(parseFloat(img.style.left)) + 'px';
    const topMatch  = slides[current].match(/top:(-?\d+(?:\.\d+)?px)/);
    const leftMatch = slides[current].match(/left:(-?\d+(?:\.\d+)?px)/);
    if (topMatch && leftMatch) {
      const oldCombo = `top:${topMatch[1]};left:${leftMatch[1]}`;
      const newCombo = `top:${newTop};left:${newLeft}`;
      if (oldCombo !== newCombo) {
        slides[current]      = slides[current].replace(oldCombo, newCombo);
        scriptEl.textContent = scriptEl.textContent.replace(oldCombo, newCombo);
      }
    }
  }

  saveBtn.textContent = 'Saved ✓';
  setTimeout(() => { saveBtn.textContent = 'Save'; }, 1500);
});

downloadBtn.addEventListener('click', () => {
  // Strip runtime DOM so the downloaded file doesn't have pre-built slides
  // that would double up when the script runs on load.
  const trackContent   = track.innerHTML;
  const trackWidth     = track.style.width;
  const trackTransform = track.style.transform;
  const prevDis        = prevBtn.disabled;
  const nextDis        = nextBtn.disabled;
  const hadEdit        = document.body.classList.contains('edit-mode');

  track.innerHTML      = '';
  track.style.width    = '';
  track.style.transform = '';
  prevBtn.disabled     = false;
  nextBtn.disabled     = false;
  coordPanel.style.display = 'none';
  editBtn.classList.remove('active');
  document.body.classList.remove('edit-mode');

  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

  // Restore live state
  track.innerHTML      = trackContent;
  track.style.width    = trackWidth;
  track.style.transform = trackTransform;
  prevBtn.disabled     = prevDis;
  nextBtn.disabled     = nextDis;
  if (hadEdit) {
    document.body.classList.add('edit-mode');
    coordPanel.style.display = 'flex';
    editBtn.classList.add('active');
  }

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'Geoffrey_Hinton.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
